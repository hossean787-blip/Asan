name: Android pilot APK (DEBUG / LAN TEST)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Miz-Mosahebe-Android-TEST-APK
          path: android-wrapper/app/build/outputs/apk/debug/*.apk
          retention-days: 7