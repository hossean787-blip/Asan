name: Android signed release APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify backend tests
        working-directory: .
        run: python -m unittest discover -s tests -q
      - name: Restore signing key from protected secret
        env:
          MIZ_KEYSTORE_BASE64: ${{ secrets.MIZ_KEYSTORE_BASE64 }}
        run: |
          test -n "$MIZ_KEYSTORE_BASE64" || { echo "Required signing secret is missing"; exit 2; }
          printf '%s' "$MIZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miz-release.jks"
          chmod 600 "$RUNNER_TEMP/miz-release.jks"
      - name: Build signed release (does not publish)
        env:
          MIZ_KEYSTORE_PATH: ${{ runner.temp }}/miz-release.jks
          MIZ_STORE_PASSWORD: ${{ secrets.MIZ_STORE_PASSWORD }}
          MIZ_KEY_ALIAS: ${{ secrets.MIZ_KEY_ALIAS }}
          MIZ_KEY_PASSWORD: ${{ secrets.MIZ_KEY_PASSWORD }}
        run: |
          test -s "$MIZ_KEYSTORE_PATH" && test -n "$MIZ_STORE_PASSWORD" && test -n "$MIZ_KEY_ALIAS" && test -n "$MIZ_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Miz-Mosahebe-v2.1.3-RELEASE-SIGNED
          path: |
            android-wrapper/app/build/outputs/apk/release/*.apk
            android-wrapper/app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 14