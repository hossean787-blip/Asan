plugins { id 'com.android.application' }
android {
    namespace 'ir.mizmosahabe.accounting'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'ir.mizmosahabe.accounting'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '2.1.3-beta'
    }
    signingConfigs {
        release {
            // Credentials are injected from the runner environment, never stored in Git.
            if (System.getenv('MIZ_KEYSTORE_PATH')) {
                storeFile file(System.getenv('MIZ_KEYSTORE_PATH'))
                storePassword System.getenv('MIZ_STORE_PASSWORD')
                keyAlias System.getenv('MIZ_KEY_ALIAS')
                keyPassword System.getenv('MIZ_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}