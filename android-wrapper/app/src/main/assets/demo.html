main{max-width:700px;padding:0 19px 94px;margin:0 auto;min-height:calc(100vh - 78px)}.eyebrow{font-size:12px;color:#148458;font-weight:800;margin-top:24px}.title{font-size:25px;font-weight:900;line-height:1.5;margin:7px 0}.sub{font-size:13px;color:var(--muted);margin:5px 0 23px}.card{border:1px solid var(--line);background:#fff;border-radius:22px;padding:19px;margin:13px 0;box-shadow:0 8px 24px #174d3310}.card h3{margin:0 0 7px;font-size:17px}.card p{color:var(--muted);margin:4px 0;font-size:12px}.role{width:100%;border:1px solid var(--line);display:flex;align-items:center;gap:13px;text-align:right}.role-icon{width:52px;height:52px;border-radius:16px;background:#e2f9eb;color:#126540;font-size:25px;display:grid;place-items:center;flex:0 0 52px}.role strong{display:block;font-size:16px}.role small{color:var(--muted);font-size:11px}.arrow{margin-right:auto;font-size:24px;color:#4bb883}.bar{background:#e8f1eb;height:8px;border-radius:20px;overflow:hidden;margin:15px 0}.bar>div{background:var(--green);height:100%;transition:width .2s}.pill{display:inline-block;background:#e6f8ee;color:#176543;border:1px solid #c9efdc;border-radius:20px;padding:3px 11px;font-size:11px;font-weight:750}.hero{background:linear-gradient(145deg,#0c6143,#237a54);color:white;border:0}.hero .pill{background:#ffffff25;color:white;border-color:#ffffff22}.hero p{color:#d1f8e4}.primary{border:0;background:var(--green);border-radius:14px;min-height:50px;padding:11px 18px;color:#063d29;font-size:14px;font-weight:900}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;min-height:50px;padding:11px 18px;font-weight:750}.full{width:100%}.flex{display:flex;align-items:center;gap:10px}.space{justify-content:space-between}.col{display:flex;flex-direction:column;gap:12px}.notice{background:#ecf7f0;border:1px solid #d0eedc;color:#51725d;border-radius:15px;font-size:12px;padding:13px 14px;margin:15px 0}.danger{background:#fff4f4;border-color:#f1d5d5;color:#a13e40}.label{display:block;font-weight:750;font-size:12px;margin:15px 0 5px}.field{width:100%;height:52px;border:1px solid #d7e7dc;border-radius:13px;padding:0 14px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#50C787;box-shadow:0 0 0 3px #50c78733}.field[dir=ltr]{text-align:left}.field-small{max-width:210px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.help{color:var(--muted);font-size:11px}.check{display:flex;gap:9px;align-items:flex-start;margin:15px 0;font-size:12px}.check input{margin-top:7px;accent-color:#2eaa68}.steps{display:flex;gap:7px;align-items:center;margin:20px 0}.step{background:white;border:1px solid var(--line);border-radius:11px;color:#8ba097;font-size:11px;padding:5px 10px}.step.active{background:#d9f6e6;color:#116846;border-color:#79d8a7;font-weight:800}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.counter{background:#eaf7ef;color:#166743;border-radius:12px;padding:5px 11px;font-weight:900;font-variant-numeric:tabular-nums}.counter.warn{color:#ac4141;background:#fff2f2}.qtext{font-weight:850;line-height:2.1;font-size:16px;margin:17px 0}.opt{width:100%;min-height:56px;text-align:right;border:1px solid var(--line);border-radius:15px;margin:8px 0;padding:12px;display:flex;align-items:center;gap:10px;background:white;color:var(--ink);font-size:13px}.opt.sel{background:#eafaf0;border-color:#50C787}.opt em{font-style:normal;font-weight:850;border:1px solid #d9ebdf;border-radius:10px;width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;color:#317453}.opt.sel em{background:var(--green);border-color:var(--green);color:#06442d}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{border:1px solid var(--line);border-radius:16px;background:#fff;padding:11px;text-align:center}.metric b{display:block;font-size:22px;line-height:1.5}.metric small{color:var(--muted);font-size:10px}.divider{height:1px;background:var(--line);margin:18px 0}.muted{colo /* Asan 2.1.5 — exact brand icon and interviewer analytics */
.brand-icon{width:48px;height:48px;object-fit:contain;flex-shrink:0}
.welcome-brand{display:flex;align-items:center;justify-content:center;padding:10px 0 0}
.welcome-brand img{display:block;width:min(310px,76vw);height:auto;max-height:120px;object-fit:contain}
.analytics-tabs,.filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.analytics-tabs button,.filter-chips button{border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--dark);font-size:12px;font-weight:750;padding:10px 13px;min-height:40px}
.analytics-tabs button.active,.filter-chips button.active{background:var(--green);border-color:var(--green);color:#063d29}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.stat-tile{background:#f3fcf6;border:1px solid #d9ebdf;padding:14px;border-radius:15px;text-align:center}
.stat-tile b{display:block;font-size:25px;color:var(--dark);line-height:1.4}
.stat-tile small{color:var(--muted);font-size:11px}
.statline{margin:15px 0 18px}
.statline .stat-head{display:flex;justify-content:space-between;gap:8px;line-height:1.6;font-size:12px;font-weight:700}
.statline .stat-head span{max-width:80%;overflow-wrap:anywhere}
.statline .stat-head b{white-space:nowrap;color:var(--dark)}
.statline .track{height:11px;margin-top:7px;border-radius:50px;background:#e5f2eb;overflow:hidden}
.statline .fill{height:100%;background:var(--green);border-radius:50px;min-width:0}
.topic-lines{display:grid;grid-template-columns:minmax(0,1fr);gap:3px}
.option-row{display:flex;gap:10px;align-items:flex-start;border:1px solid #e1eae4;border-radius:11px;padding:9px 11px;margin:7px 0;background:#fff;line-height:1.7}
.option-row.is-correct{border-color:#63c998;background:#e9f8ef}
.option-row.is-chosen:not(.is-correct){border-color:#e7aaaa;background:#fff3f3}
.option-row .opt-letter{width:24px;height:24px;border-radius:8px;background:#eef3f0;color:var(--dark);display:grid;place-items:center;flex-shrink:0;font-weight:850}
.option-row .opt-text{flex:1;overflow-wrap:anywhere}
.option-row .opt-tags{color:#19734b;font-weight:700;font-size:11px;white-space:nowrap}
.answer-brief{font-size:12px;margin-top:12px;color:var(--muted)}
.analytics-intro{font-size:12px;color:var(--muted);line-height:1.9;margin:12px 0}
@media print{.top,.analytics-tabs,.filter-chips,button{display:none!important}.card{break-inside:avoid}.statline{break-inside:avoid}}

/* Asan 2.1.7 — single-viewport exam, no navigation or scrolling */
html.exam-active, body.exam-active{height:100%;overflow:hidden;overscroll-behavior:none}
body.exam-active .top{height:62px;min-height:62px}
body.exam-active .top .brand small{display:none}
body.exam-active .top .brand b{font-size:19px}
body.exam-active .brand-icon{height:40px;width:40px}
body.exam-active main{height:calc(100dvh - 62px);min-height:0;max-height:calc(100dvh - 62px);padding:0 14px;overflow:hidden}
.exam-viewport{height:100%;width:100%;display:flex;flex-direction:column;gap:9px;padding:9px 0 max(10px,env(safe-area-inset-bottom));overflow:hidden;min-height:0}
.exam-topline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
.exam-topline .pill{white-space:nowrap;max-width:66%;overflow:hidden;text-overflow:ellipsis}
.exam-headline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto;font-size:12px;color:var(--muted)}
.exam-headline strong{color:var(--ink);font-size:14px}
.exam-headline .exam-progress{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:850}
.exam-viewport .bar{margin:0;flex:0 0 auto;height:7px}
.exam-question-card{background:white;border:1px solid var(--line);border-radius:23px;padding:clamp(12px,2.4vh,19px);box-shadow:0 8px 20px #174d3310;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.exam-topics{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto}
.exam-question-text{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:850;line-height:1.8;font-size:clamp(14px,3.8vw,19px);overflow:hidden;overflow-wrap:anywhere}
.exam-options{flex:0 0 auto;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:9px}
.exam-option{border:1px solid #dbe9e1;background:#fdfefd;border-radius:15px;min-height:clamp(67px,11.3vh,97px);padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-weight:750;font-size:clamp(11px,3.1vw,14px);line-height:1.55;text-align:center;overflow:hidden;overflow-wrap:anywhere}
.exam-option .option-letter{display:grid;place-items:center;width:23px;height:23px;min-height:23px;border-radius:7px;background:#eaf7ee;color:#156948;font-weight:900;font-size:11px}
.exam-option .option-text{display:block;max-height:5em;overflow:hidden}
.exam-option:active{background:#d4f5e2;border-color:var(--green)}
.exam-footer{display:flex;align-items:center;gap:10px;justify-content:space-between;flex:0 0 auto}
.exam-footer .skip-button{flex:1;min-height:46px;background:#fff;border:1px solid var(--line);border-radius:13px;color:#145e41;font-weight:850}
.exam-footer .exam-count{color:var(--muted);font-size:11px;white-space:nowrap}
.exam-rule-hint{text-align:center;font-size:10px;color:var(--muted);line-height:1.3;flex:0 0 auto}
.instructions-card{border-radius:24px;background:#fff;border:1px solid var(--line);padding:22px;margin-top:15px;box-shadow:0 8px 28px #174d3310}
.instructions-list{padding-right:22px;line-height:2.5;margin:13px 0;color:var(--ink)}
.instructions-list li::marker{color:#159262;font-weight:900}
@media (max-height:700px){body.exam-active .top{height:55px;min-height:55px}body.exam-active main{height:calc(100dvh - 55px);max-height:calc(100dvh - 55px)}.exam-viewport{gap:6px;padding:6px 0}.exam-question-card{padding:10px;gap:6px;border-radius:16px}.exam-option{min-height:57px;padding:5px;gap:2px}.exam-question-text{font-size:clamp(12px,3.2vw,17px);line-height:1.55}.exam-footer .skip-button{min-height:40px}}
@media (max-height:500px){.exam-option{min-height:40px}.exam-topline,.exam-headline{font-size:10px}.exam-rule-hint{display:none}}

/* Asan 2.1.8 — employer workspace, responsive and keyboard accessible */
body.admin-active{background:#f3f8f5}
body.admin-active main{max-width:1120px;padding:0 22px 85px}
body.admin-active .top{max-width:1120px}
.admin-shell{margin:22px 0 40px}
.admin-hero{background:linear-gradient(135deg,#093b2b 0%,#126347 65%,#21835c 100%);color:#fff;border-radius:24px;padding:24px 26px;position:relative;overflow:hidden;box-shadow:0 16px 38px #0d57431e}
.admin-hero:after{content:'';position:absolute;left:-50px;bottom:-85px;border:38px solid #ffffff0a;width:215px;height:215px;border-radius:50%;pointer-events:none}
.admin-hero h1{font-size:clamp(22px,3.4vw,31px);margin:5px 0 6px;line-height:1.6;font-weight:900;position:relative}
.admin-hero p{font-size:12px;line-height:2;margin:0;color:#d5f8e5;max-width:620px}
.admin-overline{font-size:11px;letter-spacing:.2px;color:#aaf2cb;font-weight:800}
.admin-hero-top{display:flex;justify-content:space-between;gap:15px;align-items:start;position:relative}
.admin-hero-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.admin-lock{border:1px solid #ffffff55;background:#ffffff1b;border-radius:12px;padding:9px 13px;color:#fff;font-size:12px;font-weight:800;white-space:nowrap}
.admin-lock:hover{background:#ffffff2a}
.admin-date{display:inline-flex;align-items:center;gap:6px;color:#e7fff1;font-size:11px;border:1px solid #ffffff36;border-radius:12px;padding:7px 10px}
.admin-nav{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;margin:14px 0 18px}
.admin-nav::-webkit-scrollbar{display:none}
.admin-nav button{border:0;border-radius:11px;background:transparent;white-space:nowrap;min-height:41px;color:#517568;padding:8px 15px;font-size:12px;font-weight:850;flex:1}
.admin-nav button.active{background:#e0f7e9;color:#0b6541;box-shadow:inset 0 0 0 1px #b5e9cc}
.admin-nav button:focus-visible{outline:2px solid var(--dark);outline-offset:-2px}
.admin-section{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 12px}
.admin-section h2{font-size:17px;line-height:1.6;margin:0;color:#143e2d}
.admin-section small{color:var(--muted);font-size:11px}
.admin-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:0 0 16px}
.admin-metric{background:#fff;border:1px solid #dcece3;padding:17px 16px;border-radius:18px;box-shadow:0 5px 18px #0a513808}
.admin-metric .value{font-size:27px;color:#0d6744;font-weight:900;line-height:1.4}
.admin-metric .desc{font-size:11px;color:#688475}
.admin-metric .accent{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:#e6f9ef;color:#137a50;margin-bottom:10px}
.admin-panels{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,1fr);gap:14px;align-items:start}
.admin-panel{background:#fff;border:1px solid #deece2;border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:0 6px 25px #114d3410}
.admin-panel h3{margin:0 0 8px;font-size:15px;color:#173e2d}
.admin-help{color:#6b8175;font-size:11px;line-height:1.9}
.admin-empty{text-align:center;padding:32px 16px;background:#f9fcfa;border:1px dashed #c9e5d2;border-radius:16px;color:#628073}
.admin-empty strong{display:block;color:#285541;font-size:14px}
.admin-empty .empty-icon{font-size:32px;margin-bottom:10px}
.admin-mini-table{width:100%;border-collapse:collapse;text-align:right}
.admin-mini-table th{font-size:11px;font-weight:700;color:#80978a;padding:9px 7px;border-bottom:1px solid #e8efeb}
.admin-mini-table td{font-size:12px;padding:11px 7px;border-bottom:1px solid #eef3ef;vertical-align:middle}
.admin-mini-table tr:last-child td{border-bottom:0}
.admin-mini-table button{font-size:12px;color:#08774d;background:transparent;border:0;font-weight:850;text-align:right}
.admin-status{display:inline-flex;border-radius:99px;background:#ecf5ef;color:#426a56;border:1px solid #d8e9de;padding:2px 9px;align-items:center;font-weight:800;font-size:10px;white-space:nowrap}
.admin-status[data-status='interview']{background:#e0f6eb;color:#0a6e46;border-color:#b4e7cc}
.admin-status[data-status='selected']{background:#d5f7e4;color:#09613f;border-color:#86d8ab}
.admin-status[data-status='rejected']{background:#fff1f0;color:#934b4a;border-color:#f3d6d3}
.admin-status[data-status='review']{background:#fff9e9;color:#8d682e;border-color:#f4e4b9}
.admin-pct{font-variant-numeric:tabular-nums;color:#16774d;font-weight:900}
.admin-toolbar{display:grid;grid-template-columns:minmax(180px,2fr) minmax(130px,1fr) minmax(130px,1fr) minmax(135px,1fr);gap:9px;margin:12px 0}
.admin-toolbar input,.admin-toolbar select,.admin-control{width:100%;min-width:0;height:43px;background:#fff;border:1px solid #d6e7dc;border-radius:12px;padding:0 12px;color:#214c37;outline:0;font-size:12px}
.admin-toolbar input:focus,.admin-toolbar select:focus,.admin-control:focus{border-color:#2bbd77;box-shadow:0 0 0 3px #50c78733}
.admin-row{width:100%;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) 82px 90px;gap:12px;align-items:center;background:white;border:1px solid #e0eae3;border-radius:15px;padding:13px 15px;margin:8px 0;text-align:right;color:var(--ink)}
.admin-row:hover{background:#f6fcf8;border-color:#b7e5c7}
.admin-row strong{display:block;font-size:13px;overflow-wrap:anywhere}
.admin-row small{display:block;font-size:11px;color:#7e9788;line-height:1.8}
.admin-row-score{font-size:19px;font-weight:900;color:#18754c;text-align:center;font-variant-numeric:tabular-nums}
.admin-row-action{text-align:left;color:#137a4e;font-size:11px;font-weight:850}
.admin-chipset{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.admin-chipset button{border:1px solid #dbeae0;border-radius:12px;padding:8px 12px;background:#fff;font-size:11px;color:#4e7160;font-weight:850}
.admin-chipset button.active{background:#dff6e8;border-color:#81d1a5;color:#0b6c45}
.admin-result-count{font-size:11px;color:#6f8878;margin:8px 0}
.admin-review-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:12px;margin-top:12px}
.admin-review-form label{display:block;color:#526c60;font-size:11px;font-weight:800;margin-bottom:4px}
.admin-review-form textarea{min-height:88px;width:100%;resize:vertical;line-height:1.9;padding:10px 12px;border:1px solid #d7e7dc;border-radius:12px;font:inherit;color:#173b2d;font-size:12px}
.admin-review-form .admin-control{height:44px}
.admin-review-form .review-save{align-self:end}
.admin-review-note{background:#f4fbf7;border:1px solid #d9e8dd;padding:12px 13px;border-radius:12px;font-size:12px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.admin-score-ring{width:114px;height:114px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 7px 24px #0d6d4420}
.admin-score-ring > div{width:86px;height:86px;border-radius:50%;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center}
.admin-score-ring strong{font-size:27px;color:#13563a;line-height:1.1}
.admin-score-ring small{font-size:10px;color:var(--muted)}
.admin-dossier{display:flex;align-items:center;gap:18px;justify-content:space-between}
.admin-quick-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.admin-quick-actions button{border:1px solid #b9e4c8;color:#116c48;background:#f5fcf8;padding:10px 13px;border-radius:11px;font-size:12px;font-weight:850}

","بدون ثبت در دفاتر"],"answer":2},{"id":"D25","topic":"خطایابی و تصمیم عملی","difficulty":"hard","text":"تراز آزمایشی ۱۲ میلیون ریال اختلاف دارد و یک ثبت بدهکار ۱۲ میلیون ریالی انجام نشده است. راه درست چیست؟","options":["ثبت تصادفی در حساب بانک","شناسایی سند و اصلاح ثبت با مستندات","حذف تراز آزمایشی","دو برابرکردن حساب بستانکار"],"answer":1},{"id":"D26","topic":"اصول تعهدی","difficulty":"hard","text":"خدمات به مبلغ ۸۰ میلیون ریال در اسفند ارائه شده ولی وجه در فروردین دریافت می‌شود. با فرض تحقق شرایط شناسایی، درآمد متعلق به کدام ماه است؟","options":["فروردین","بهمن","اسفند","اردیبهشت"],"answer":2},{"id":"D27","topic":"ذخیره مطالبات","difficulty":"hard","text":"مانده حساب‌های دریافتنی ۲۰۰ میلیون ریال است. ذخیره موردنیاز پایان سال ۵٪ و مانده بستانکار ذخیره قبل از تعدیل ۳ میلیون ریال است. هزینه مطالبات مشکوک‌الوصول چند میلیون ریال است؟","options":["۷","۱۰","۱۳","۳"],"answer":0},{"id":"D28","topic":"انحرافات هزینه","difficulty":"hard","text":"مقدار واقعی مصرف ۱۱۰ واحد، مقدار استاندارد مجاز ۱۰۰ واحد و نرخ استاندارد هر واحد ۲۰ هزار ریال است. انحراف مقداری مواد چند هزار ریال نامساعد است؟","options":["۱۰۰","۱۱۰","۲۰۰","۲۰"],"answer":2},{"id":"D29","topic":"صورت جریان نقد","difficulty":"medium","text":"دریافت وجه نقد از مشتری بابت فروش عادی شرکت معمولاً در کدام گروه صورت جریان وجه نقد قرار می‌گیرد؟","options":["فعالیت‌های عملیاتی","فعالیت‌های سرمایه‌گذاری","فعالیت‌های تأمین مالی","تغییرات غیرنقدی"],"answer":0},{"id":"D30","topic":"کنترل اسناد","difficulty":"medium","text":"در بررسی یک فاکتور خرید قبل از پرداخت، کدام کنترل مناسب است؟","options":["پرداخت بدون سند","تطبیق سفارش، رسید دریافت کالا و فاکتور","ثبت پرداخت به حساب فروش","حذف تأیید مسئول خرید"],"answer":1},{"id":"P031","topic":"اصول و مفاهیم","difficulty":"easy","text":"شرکتی 80 میلیون ریال دارایی و 30 میلیون ریال بدهی دارد. حقوق مالکانه چند میلیون ریال است؟","options":["30","80","110","50"],"answer":3,"explanation":"حقوق مالکانه = دارایی منهای بدهی = 50 میلیون ریال."},{"id":"P032","topic":"صورت‌های مالی","difficulty":"medium","text":"درآمد دوره 120 و کل هزینه‌های دوره 40 میلیون ریال است. سود خالص چند میلیون ریال می‌شود؟","options":["120","160","40","80"],"answer":3,"explanation":"سود خالص = درآمد − هزینه = 80."},{"id":"P033","topic":"انبار و موجودی کالا","difficulty":"medium","text":"موجودی ابتدای دوره 80، خرید خالص 160 و موجودی پایان دوره 30 میلیون ریال است. بهای تمام‌شده کالای فروش‌رفته چقدر است؟","options":["130","210","110","270"],"answer":1,"explanation":"بهای تمام‌شده = موجودی اول + خرید خالص − موجودی پایان = 210."},{"id":"P034","topic":"دریافتنی‌ها و پرداختنی‌ها","difficulty":"easy","text":"مانده بدهی به تأمین‌کننده 80 میلیون ریال است. شرکت 30 میلیون ریال از آن را پرداخت می‌کند. مانده حساب‌های پرداختنی چقدر است؟","options":["50","110","80","30"],"answer":0,"explanation":"بدهی با پرداخت کاهش می‌یابد؛ مانده 50."},{"id":"P035","topic":"دارایی ثابت و استهلاک","difficulty":"medium","text":"بهای دارایی 800 و ارزش اسقاط آن 60 میلیون ریال است. عمر مفید ۵ سال است؛ استهلاک سالانه خط مستقیم چند میلیون ریال است؟","options":["160","740","172","148"],"answer":3,"explanation":"استهلاک = (بها − ارزش اسقاط) تقسیم بر عمر = 148."},{"id":"P036","topic":"حقوق و دستمزد","difficulty":"easy","text":"حقوق ناخالص کارمند 80 و کسورات قانونی و توافقی جمعاً 30 میلیون ریال است. خالص پرداختنی چند میلیون ریال خواهد بود؟","options":["110","50","30","80"],"answer":1,"explanation":"خالص پرداختنی = ناخالص − کسورات = 50."},{"id":"P037","topic":"ارزش افزوده و سامانه مؤدیان","difficulty":"medium","text":"در یک مثال فرضی و صرفاً محاسباتی، مبلغ فروش بدون مالیات 800 میلیون ریال و نرخ فرضی ارزش افزوده ۱۰٪ است. مالیات این فروش چند میلیون ریال می‌شود؟","options":["720","80","880","800"],"answer":1,"explanation":"۱۰٪ از 800 = 80 میلیون ریال. این نرخ فرضی است."},{"id":"P038","topic":"خرید و فروش","difficulty":"medium","text":"فروش خالص 240 و بهای تمام‌شده کالای فروش‌رفته 60 میلیون ریال است. سود ناخالص چقدر است؟","options":["180","240","60","300"],"answer":0,"explanation":"سود ناخالص = فروش خالص − بهای تمام‌شده = 180."},{"id":"P039","topic":"بانک و خزانه","difficulty":"hard","text":"مانده بانک در دفاتر شرکت 80 میلیون ریال است. بانک 8 میلیون ریال کارمزد کسر و 3 میلیون ریال سود بانکی واریز کرده که در دفاتر ثبت نشده‌اند. مانده اصلاح‌شده دفاتر چقدر می‌شود؟","options":["75","69","91","85"],"answer":0,"explanation":"از دفاتر هزینه کارمزد کم و سود اضافه می‌شود: 75."},{"id":"P040","topic":"اصلاح و بستن حساب‌ها","difficulty":"medium","text":"بیمه ۱۲ماهه به مبلغ 96 میلیون ریال در حساب پیش‌پرداخت ثبت شده است. پس از سپری‌شدن 2 ماه، هزینه بیمه شناسایی‌شده چند میلیون ریال است؟","options":["8","80","96","16"],"answer":3,"explanation":"سهم هزینه = کل پیش‌پرداخت × 2/۱۲ = 16."},{"id":"P041","topic":"ارز و بازرگانی خارجی","difficulty":"hard","text":"شرکت 1000 واحد ارز دریافتنی دارد. نرخ هر واحد از ۵۰۰٬۰۰۰ ریال به 502,000 ریال افزایش یافته است. سود تسعیر چند میلیون ریال است؟","options":["4","2","3","20"],"answer":1,"explanation":"تفاوت نرخ × تعداد ارز = 1000 × 2000 ریال = 2 میلیون ریال."},{"id":"P042","topic":"پیمانکاری و پروژه","difficulty":"medium","text":"صورت‌وضعیت تأییدشده پیمانکار 800 میلیون ریال است و بر اساس قرارداد فرضی، ۱۰٪ آن به‌عنوان سپرده حسن انجام کار نگهداری می‌شود. مبلغ قابل پرداخت پیش از سایر کسورات چند میلیون ریال است؟","options":["800","880","720","80"],"answer":2,"explanation":"۹۰٪ صورت وضعیت = 720."},{"id":"P043","topic":"حسابداری مدیریت و بودجه","difficulty":"hard","text":"هزینه ثابت دوره 800 میلیون ریال، قیمت فروش هر واحد 20 و هزینه متغیر هر واحد 10 میلیون ریال است. نقطه سربه‌سر چند واحد است؟","options":["100","40","80","160"],"answer":2,"explanation":"نقطه سربه‌سر = هزینه ثابت ÷ (قیمت فروش − هزینه متغیر) = 80 واحد."},{"id":"P044","topic":"دریافتنی‌ها و پرداختنی‌ها","difficulty":"medium","text":"مانده ناخالص حساب‌های دریافتنی 800 میلیون ریال است. شرکت بر اساس برآورد داخلی خود، ۵٪ را مشکوک‌الوصول می‌داند. ذخیره لازم چند میلیون ریال است؟","options":["160","40","80","800"],"answer":1,"explanation":"۵٪ × 800 = 40."},{"id":"P045","topic":"صنعتی و بهای تمام‌شده","difficulty":"medium","text":"مواد مستقیم 80، دستمزد مستقیم 30 و سربار ساخت 12 میلیون ریال است. مجموع هزینه‌های تولید (بدون تغییر کالای در جریان) چند میلیون ریال می‌شود؟","options":["92","152","122","110"],"answer":2,"explanation":"جمع مواد مستقیم + دستمزد مستقیم + سربار = 122."},{"id":"P046","topic":"صنعتی و بهای تمام‌شده","difficulty":"hard","text":"سربار برآوردی 800 میلیون ریال و ساعات کار مستقیم کل 100 ساعت است. سفارشی با 20 ساعت کار مستقیم، چه میزان سربار جذب می‌کند (میلیون ریال)؟","options":["800","320","640","160"],"answer":3,"explanation":"نرخ جذب = 800/100؛ ضرب در 20 ساعت = 160."},{"id":"P047","topic":"صورت‌های مالی","difficulty":"medium","text":"شرکت در این دوره 80 میلیون ریال فروش نقد و 30 میلیون ریال فروش نسیه دارد. با فرض نبود سایر جریان‌ها، وجه نقد حاصل از این فروش‌ها چند میلیون ریال است؟","options":["110","30","50","80"],"answer":3,"explanation":"فروش نسیه در لحظه فروش جریان وجه نقد ایجاد نمی‌کند؛ دریافت نقدی 80 است."},{"id":"P048","topic":"انبار و موجودی کالا","difficulty":"hard","text":"با روش FIFO، 10 واحد کالا با بهای واحد 5 و سپس 10 واحد با بهای واحد 10 میلیون ریال خریداری شده است. بهای تمام‌شده فروش 15 واحد چند میلیون ریال است؟","options":["150","125","100","75"],"answer":2,"explanation":"FIFO ابتدا لایه اول و سپس ۵ واحد از لایه دوم: 10×5+۵×10=100."},{"id":"P049","topic":"حسابرسی و کنترل داخلی","difficulty":"medium","text":"موجودی صندوق طبق دفاتر 80 و شمارش فیزیکی 30 میلیون ریال است. کسری صندوق چند میلیون ریال است؟","options":["110","50","80","30"],"answer":1,"explanation":"کسری صندوق = مانده دفاتر منهای موجودی واقعی = 50."},{"id":"P050","topic":"صورت‌های مالی","difficulty":"hard","text":"دارایی جاری 400، موجودی کالا 60 و بدهی جاری 50 میلیون ریال است. با فرض نداشتن سایر اقلام کاهنده، نسبت آنی را تا دو رقم اعشار محاسبه کنید.","options":["6.80","9.20","1.20","8.00"],"answer":0,"explanation":"نسبت آنی = (دارایی جاری − موجودی کالا) ÷ بدهی جاری = 6.80."},{"id":"P051","topic":"اصول و مفاهیم","difficulty":"easy","text":"شرکتی 120 میلیون ریال دارایی و 50 میلیون ریال بدهی د function personalPage(){return `${stepper(2)}<div class="eyebrow">مرحله دوم · اطلاعات داوطلب</div><h1 class="title">فرم ثبت‌نام آزمون</h1><p class="sub">موقعیت انتخاب‌شده: <b>${esc(profileRole())}</b></p><form id="personalForm" class="card"><label class="label" for="name">نام و نام خانوادگی *</label><input class="field" id="name" name="name" required minlength="3" maxlength="80" autocomplete="name" placeholder="نام کامل"><label class="label" for="mobile">شماره تماس *</label><input class="field" id="mobile" name="mobile" dir="ltr" inputmode="tel" type="tel" required maxlength="18" placeholder="09123456789"><div class="grid"><div><label class="label" for="education">آخرین مدرک تحصیلی *</label><select class="field" id="education" name="education" required><option value="">انتخاب کنید</option><option>دیپلم</option><option>کاردانی</option><option>کارشناسی</option><option>کارشناسی ارشد</option><option>دکتری</option><option>سایر</option></select></div><div><label class="label" for="experience">سابقه حسابداری *</label><select class="field" id="experience" name="experience" required><option value="">انتخاب کنید</option><option>بدون سابقه</option><option>کمتر از ۱ سال</option><option>۱ تا ۳ سال</option><option>۳ تا ۵ سال</option><option>بیش از ۵ سال</option></select></div></div><label class="label" for="city">شهر محل سکونت (اختیاری)</label><input class="field" id="city" name="city" maxlength="60" placeholder="مثلاً اراک"><label class="check"><input type="checkbox" id="consent" required> <span>موافقم مشخصات و پاسخ‌های آزمون من روی این دستگاه برای بررسی مسئول استخدام ذخیره شود.</span></label><div class="notice">آزمون شامل ۱۰۰ سؤال و ${setting().minutes} دقیقه زمان است. با پایان زمان، پاسخ‌ها خودکار ثبت می‌شوند و پاسخنامه به داوطلب نمایش داده نمی‌شود.</div><div id="formError" class="tiny" style="color:var(--red)"></div><div class="flex"><button type="button" class="secondary" data-act="roles">بازگشت</button><button class="primary" style="flex:1" type="submit">ثبت اطلاعات و مشاهده قوانین ←</button></div></form>`}
function instructionPage(){return `${stepper(2)}<div class="eyebrow">پیش از آغاز آزمون</div><h1 class="title">قوانین آزمون استخدامی</h1><p class="sub">${esc(profileRole())} · ${esc(state.profile?.name||'')}</p><div class="instructions-card"><div class="pill">۱۰۰ سؤال چهارگزینه‌ای · ۲۰ دقیقه</div><ol class="instructions-list"><li>با فشردن «شروع آزمون»، زمان‌سنج ۲۰ دقیقه‌ای آغاز می‌شود.</li><li>به‌محض انتخاب هر گزینه، پاسخ ثبت و سؤال بعدی نمایش داده می‌شود.</li><li>می‌توانید هر سؤال را بدون پاسخ رد کنید؛ امکان بازگشت به آن وجود ندارد.</li><li><b>در صورت خروج از برنامه، رفتن به برنامه دیگر یا قفل‌کردن گوشی، آزمون پایان می‌یابد</b> و پاسخ‌های ثبت‌شده برای مصاحبه‌گر ذخیره می‌شوند.</li><li>پس از آخرین سؤال یا پایان زمان، آزمون خودکار ثبت می‌شود.</li><li>نتیجه و پاسخنامه فقط در پنل مسئول استخدام قابل مشاهده است.</li></ol><div class="notice">در آزمون واقعی شرکت، گوشی را تا پایان آزمون در همین صفحه نگه دارید. این نسخه دارای سؤالات نمونه عمومی است.</div><button class="primary full" data-act="startConfirmed">قوانین را خواندم؛ شروع آزمون</button><button class="secondary full" style="margin-top:10px" data-act="roles">بازگشت به انتخاب موقعیت</button></div>`}
function chooseNext(){let e=state.exam;if(!e)return null;const used=new Set(e.qids),counts={};for(let id of e.qids){const q=QUESTION_BANK.find(x=>x.id===id);if(q)counts[q.topic]=(counts[q.topic]||0)+1}let desired=roles[e.role].start;const done=e.qids.filter(id=>e.answers[id]!==undefined).slice(-2);if(done.length===2){const n=done.reduce((x,id)=>x+(e.answers[id]===QUESTION_BANK.find(q=>q.id===id).answer?1:0),0);desired=n===2?'hard':n===0?'easy':'medium'}let pool=QUESTION_BANK.filter(q=>!used.has(q.id));if(!pool.length)return null;pool.sort((a,b)=>{const x=(a.difficulty===desired?0:1)-(b.difficulty===desired?0:1);if(x)return x;const y=(counts[a.topic]||0)-(counts[b.topic]||0);if(y)return y;return ((a.id.charCodeAt(1)*11+e.seed)%53)-((b.id.charCodeAt(1)*11+e.seed)%53)});return pool[0]}
function startExam(form){let f=new FormData(form);let name=String(f.get('name')||'').trim().replace(/\s+/g,' '),mobile=String(f.get('mobile')||'').trim().replace(/[\u06f0-\u06f9]/g,x=>String(x.charCodeAt(0)-0x6f0)).replace(/[\u0660-\u0669]/g,x=>String(x.charCodeAt(0)-0x660));if(name.length<3||!/^\+?[0-9\- ]{10,18}$/.test(mobile)){alert('نام کامل و شماره تماس معتبر وارد کنید.');return}let profile={name,mobile,education:f.get('education'),experience:f.get('experience'),city:String(f.get('city')||'').trim()};if(!profile.education||!profile.experience||!$('#consent').checked){alert('تمام موارد ضروری را تکمیل و رضایت را تأیید کنید.');return}state.profile=profile;go('instructions')}

function questionOf(id){return QUESTION_BANK.find(q=>q.id===id)}
function examPage(){let e=state.exam;if(!e)return rolesPage();let q=questionOf(e.qids[state.idx]);if(!q)return '<div class="notice danger">سؤالی برای نمایش پیدا نشد.</div>';let answered=Object.keys(e.answers).length;return `<div class="exam-viewport"><div class="exam-topline"><span class="pill">${esc(roles[e.role].label)}</span><span class="counter ${remaining()<=300?'warn':''}" id="clock">⏱ ${fmtSecs(remaining())}</span></div><div class="exam-headline"><strong>${esc(e.profile.name)}</strong><span class="exam-progress">سؤال ${state.idx+1} از ${N}</span></div><div class="bar"><div style="width:${Math.max(1,100*(state.idx+1)/N)}%"></div></div><section class="exam-question-card"><div class="exam-topics"><span class="pill">${esc(q.topic)}</span><span class="pillgray">${q.difficulty==='easy'?'آسان':q.difficulty==='medium'?'متوسط':'سخت'}</span></div><div class="exam-question-text" id="questionText">${esc(q.text)}</div><div class="exam-options">${q.options.map((v,i)=>`<button class="exam-option" data-choice="${i}"><span class="option-letter">${'ابجد'[i]}</span><span class="option-text">${esc(v)}</span></button>`).join('')}</div></section><div class="exam-footer"><button class="skip-button" data-act="skip">رد کردن سؤال ←</button><span class="exam-count">${answered} پاسخ ثبت‌شده</span></div><div class="exam-rule-hint">پاسخ یا رد سؤال، مستقیماً شما را به سؤال بعد می‌برد.</div></div>`}
function chooseAnswer(index){let e=state.exam;if(!e||remaining()<=0){if(e)complete(true);return}let q=questionOf(e.qids[state.idx]);if(!q||e.answers[q.id]!==undefined)return;e.answers[q.id]=index;if(!saveActive())return;advanceQuestion()}

function complete(timedOut,reason){let e=state.exam;if(!e)return;let now=Date.now(),answers=e.qids.map(id=>{let q=questionOf(id);return {id,text:q.text,topic:q.topic,difficulty:q.difficulty,options:q.options,selected:e.answers[id]===undefined?null:e.answers[id],correct:q.answer,explanation:q.explanation||''}});let right=answers.filter(a=>a.selected===a.correct).length;let result={id:e.id,role:e.role,profile:e.profile,start:e.start,end:now,durationSeconds:Math.max(0,Math.floor((now-e.start)/1000)),total:N,answered:answers.filter(a=>a.selected!==null).length,right,wrong:answers.filter(a=>a.selected!==null&&a.selected!==a.correct).length,percent:Math.round(right*100/N),timedOut:!!timedOut,endedByExit:reason==='background',answers};let rec=records();rec.unshift(result);if(!setJSON(K_RECORDS,rec)){return}localStorage.removeItem(K_ACTIVE);state.exam=null;state.idx=0;state.selectedId=result.id;state.adminOK=false;go('finished')}

async function derivePin(pin,salt){if(!crypto||!crypto.subtle)throw new Error('رمزنگاری در این دستگاه در دسترس نیست');let enc=new TextEncoder(),material=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);let raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},material,256);return Array.from(new Uint8Array(raw)).map(b=>b.toString(16).padStart(2,'0')).join('')}

${count?`<div class="card"><h3>توزیع نمره داوطلبان</h3><p class="analytics-intro">نمره‌های ثبت‌شده در گروه انتخابی، بدون رتبه‌بندی استخدامی خودکار.</p>${groups.map(g=>statLine('نمره '+g[0]+'٪',rows.filter(x=>x.percent>=g[1]&&x.percent<=g[2]).length,count)).join('')}</div>

<div class="card"><h3>پاسخ‌دهی و درجه سختی</h3><div class="stat-grid">${statTile(answered.length,'گزینه انتخاب‌شده')}${statTile(selected.length-answered.length,'بدون پاسخ')}</div>${[['easy','آسان'],['medium','متوسط'],['hard','سخت']].map(([k,n])=>{let d=levelMap.get(k)||{yes:0,n:0};return statLine('سؤالات '+n,d.yes,d.n)}).join('')}</div>
<div class="card"><h3>تحلیل حوزه‌های حسابداری</h3><p class="analytics-intro">نسبت پاسخ صحیح به تعداد سؤالِ مطرح‌شده در هر حوزه.</p><div class="topic-lines">${Array.from(topicMap.entries()).sort((a,b)=>(a[1].yes/Math.max(1,a[1].n))-(b[1].yes/Math.max(1,b[1].n))).map(([name,x])=>statLine(name,x.yes,x.n)).join('')}</div></div>
<div class="card"><h3>📊 آمار انتخاب گزینه‌های هر سؤال</h3><p class="analytics-intro">برای هر سؤال، تعداد انتخاب گزینه‌های الف، ب، ج، د و میزان بی‌پاسخ مشخص است. گزینه صحیح فقط در این پنل دیده می‌شود.</p><label class="label" for="questionStatSelect">انتخاب سؤال</label><select class="field" id="questionStatSelect">${available.map(x=>`<option value="${esc(x.id)}" ${q&&q.id===x.id?'selected':''}>${esc(x.id)} · ${esc(x.topic)}</option>`).join('')}</select>${q?`<p style="font-weight:750;margin-top:15px">${esc(q.text)}</p><span class="pill">${q.n} بار مطرح شده</span>${q.options.map((opt,i)=>statLine(['الف','ب','ج','د'][i]+' · '+opt+(i===q.correct?' ✓ گزینه صحیح':''),q.counts[i],q.n)).join('')}${statLine('بی‌پاسخ',q.blank,q.n)}`:''}</div>
<div class="notice">این آمار فقط برای آزمون‌های ثبت‌شده روی همین گوشی است و برای تصمیم قطعی استخدام، بانک سؤال باید تأیید تخصصی و درجه سختی کالیبره شود.</div>`:`<div class="card"><p>هنوز آزمون ثبت‌شده‌ای برای این موقعیت وجود ندارد. پس از تکمیل آزمون داوطلبان، نمودارها و آمار گزینه‌ها اینجا نمایش داده می‌شوند.</p></div>`}`)}
function adminList(){let selected=records().find(x=>x.id===state.selectedId);if(selected)return detailPage(selected);if(state.adminTab==='stats')return statsPage(records());if(state.adminTab==='list')return candidateListPage();return adminOverview()}
function detailPage(r){let rows=Array.isArray(r.answers)?r.answers:[],byTopic={},byDifficulty={};rows.forEach(x=>{let t=byTopic[x.topic]||(byTopic[x.topic]={yes:0,total:0});t.total++;if(x.selected===x.correct)t.yes++;let d=byDifficulty[x.difficulty]||(byDifficulty[x.difficulty]={yes:0,total:0});d.total++;if(x.selected===x.correct)d.yes++});
let indexed=rows.map((x,i)=>({...x,ordinal:i+1}));let selected=state.answerFilter==='correct'?indexed.filter(x=>x.selected===x.correct):state.answerFilter==='wrong'?indexed.filter(x=>x.selected!==null&&x.selected!==x.correct):state.answerFilter==='blank'?indexed.filter(x=>x.selected===null):indexed;
let rv=reviewOf(r.id);return `<section class="admin-shell"><div class="row" style="margin:12px 0 14px"><button class="secondary" data-act="backResults">← بازگشت به داوطلبان</button><button class="secondary" data-act="logout">قفل</button></div>
<div class="admin-panel admin-dossier"><div><div class="admin-overline" style="color:#168453">پرونده اختصاصی داوطلب</div><h1 class="title" style="margin:6px 0">${esc(r.profile.name)}</h1><p class="sub" style="margin-bottom:7px">${esc(roles[r.role].label)} · ${new Date(r.end).toLocaleString('fa-IR')}</p>${statusTag(rv.status)}</div><div class="admin-score-ring" style="background:conic-gradient(#50C787 ${scoreOf(r)}%,#e4efe8 0)"><div><strong>${scoreOf(r)}٪</strong><small>امتیاز آزمون</small></div></div></div>
<div class="admin-panel"><div class="admin-section"><h2>ارزیابی و یادداشت مصاحبه‌گر</h2><small>فقط برای مدیریت</small></div>
<form id="reviewForm" class="admin-review-form"><div><label for="reviewStatus">وضعیت استخدامی</label><select id="reviewStatus" class="admin-control">${Object.entries(STATUS_LABELS).map(([k,v])=>`<option value="${k}" ${rv.status===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div><label for="reviewNote">یادداشت و جمع‌بندی ارزیابی</label><textarea id="reviewNote" maxlength="1000" placeholder="مثلاً: تسلط خوب به ثبت اسناد، نیاز به بررسی بیشتر در مالیات">${esc(rv.note||'')}</textarea></div><div class="review-save"><button class="primary full" type="submit">ذخیره ارزیابی</button></div></form>
${rv.updatedAt?`<p class="admin-help">آخرین ویرایش: ${new Date(rv.updatedAt).toLocaleString('fa-IR')}</p>`:''}</div><div class="card"><div class="row"><div><span class="tiny muted">نمره کل</span><div style="font-size:40px;font-weight:900;color:#127748">${r.percent}٪</div></div><span class="pill">${r.timedOut?'اتمام زمان':'ثبت‌شده'}</span></div><div class="grid3"><div class="metric"><b>${r.right}</b><small>صحیح</small></div><div class="metric"><b>${r.wrong}</b><small>غلط</small></div><div class="metric"><b>${r.total-r.answered}</b><small>بدون پاسخ</small></div></div><div class="divider"></div><div><b>مشخصات داوطلب</b><p>شماره تماس: <b dir="ltr">${esc(r.profile.mobile)}</b> · مدرک: ${esc(r.profile.education)}</p><p>سابقه: ${esc(r.profile.experience)} · شهر: ${esc(r.profile.city||'ثبت نشده')}</p><p>زمان صرف‌شده: ${Math.ceil(r.durationSeconds/60)} دقیقه · کد: ${esc(r.id)}</p><p>وضعیت: <b>${r.endedByExit?'پایان به‌دلیل خروج از برنامه':r.timedOut?'پایان زمان آزمون':'پایان طبیعی آزمون'}</b></p></div></div>
<div class="card"><h3>عملکرد داوطلب در مباحث</h3>${Object.entries(byTopic).sort((a,b)=>a[0].localeCompare(b[0])).map(([topic,x])=>statLine(topic,x.yes,x.total)).join('')}</div>
<div class="card"><h3>نمره بر اساس سختی سؤال</h3>${[['easy','آسان'],['medium','متوسط'],['hard','سخت']].map(([k,label])=>{let x=byDifficulty[k]||{yes:0,total:0};return statLine(label,x.yes,x.total)}).join('')}</div>
<div class="row"><h3>پاسخنامه مخصوص مصاحبه‌گر · پاسخ‌های ثبت‌شده</h3><button class="secondary" data-act="showStats">آمار کل</button></div>
<div class="filter-chips">${[['all','همه'],['correct','صحیح'],['wrong','غلط'],['blank','بی‌پاسخ']].map(([k,v])=>`<button class="${state.answerFilter===k?'active':''}" data-answer-filter="${k}">${v}</button>`).join('')}</div>
${selected.map(x=>`<div class="answer ${x.selected===x.correct?'good':'bad'}"><div class="row"><b>سؤال ${x.ordinal} · ${esc(x.topic)}</b><span class="ansstate">${x.selected===null?'بی‌پاسخ':x.selected===x.correct?'صحیح':'غلط'}</span></div><p>${esc(x.text)}</p>${x.options.map((opt,i)=>`<div class="option-row ${i===x.correct?'is-correct':''} ${i===x.selected?'is-chosen':''}"><span class="opt-letter">${['الف','ب','ج','د'][i]}</span><span class="opt-text">${esc(opt)}</span><span class="opt-tags">${i===x.correct?'✓ پاسخ صحیح:':''}${i===x.selected?' · انتخاب داوطلب':''}</span></div>`).join('')}${x.explanation?`<div class="answer-brief">توضیح: ${esc(x.explanation)}</div>`:''}</div>`).join('')||'<div class="notice">سؤالی در این فیلتر وجود ندارد.</div>'}
<button data-act="print" class="primary full" style="margin:20px 0">چاپ یا ذخیره گزارش به PDF</button><p class="footer">این ارزیابی با بانک نمونه عمومی انجام شده و معیار نهایی تصمیم استخدامی نیست.</p></section>`}
function render(){if(state.exam && remaining()<=0){complete(true);return}let isExam=state.page==='exam';document.documentElement.classList.toggle('exam-active',isExam);document.body.classList.toggle('exam-active',isExam);document.body.classList.toggle('admin-active',state.page==='admin'&&state.adminOK);$('#root').innerHTML=state.page==='roles'?rolesPage():state.page==='personal'?personalPage():state.page==='instructions'?instructionPage():state.page==='exam'?examPage():state.page==='finished'?finishedPage():adminPage();$('#adminBtn').classList.toggle('hide',isExam||state.page==='finished'||state.page==='admin');}
async function submitPin(form){let pin=form.querySelector('#pin').value,stored=getJSON(K_PIN,null),err=$('#adminError');if(!/^\d{6}$/.test(pin)){err.textContent='کد باید دقیقاً ۶ رقم باشد.';return}try{if(!stored){let confirmPin=form.querySelector('#confirmPin').value;if(pin!==confirmPin){err.textContent='تکرار کد یکسان نیست.';return}let salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');let hash=await derivePin(pin,salt);if(!setJSON(K_PIN,{salt,hash,attempts:0,lockUntil:0}))return;state.adminOK=true;state.adminTab='overview';go('admin');return}if(stored.lockUntil>Date.now()){err.textContent='تلاش‌های ناموفق زیاد بوده؛ بعداً دوباره امتحان کنید.';return}let hash=await derivePin(pin,stored.salt);if(hash!==stored.hash){stored.attempts=(stored.attempts||0)+1;if(stored.attempts>=5){stored.lockUntil=Date.now()+60000;stored.attempts=0}setJSON(K_PIN,stored);err.textContent='کد مدیریت اشتباه است.';return}stored.attempts=0;stored.lockUntil=0;setJSON(K_PIN,stored);state.adminOK=true;state.selectedId=null;state.adminTab='overview';go('admin')}catch(e){err.textContent='این مرورگر از رمزنگاری موردنیاز پشتیبانی نمی‌کند.'}}
document.addEventListener('input',e=>{if(e.target.id==='adminSearch'&&state.adminOK){state.adminQuery=e.target.value;refreshCandidateRows()}});
document.addEventListener('change',e=>{if(e.target.id==='questionStatSelect'&&state.adminOK){state.questionStatId=e.target.value;go('admin')}if(state.adminOK&&['adminRoleFilter','adminStatusFilter','adminSort'].includes(e.target.id)){let key={adminRoleFilter:'adminRoleFilter',adminStatusFilter:'adminStatusFilter',adminSort:'adminSort'}[e.target.id];state[key]=e.target.value;go('admin')}});
document.addEventListener('submit',e=>{if(e.target.id==='personalForm'){e.preventDefault();startExam(e.target)}if(e.target.id==='pinForm'){e.preventDefault();submitPin(e.target)}if(e.target.id==='reviewForm'){e.preventDefault();saveReview(e.target)}});
document.addEventListener('click',e=>{const adminTab=e.target.closest('[data-admin-tab]');if(adminTab&&state.adminOK){state.adminTab=adminTab.dataset.adminTab;state.selectedId=null;go('admin');return}const statRole=e.target.closest('[data-stat-role]');if(statRole&&state.adminOK){state.statRole=statRole.dataset.statRole;state.questionStatId='';go('admin');return}const af=e.target.closest('[data-answer-filter]');if(af&&state.adminOK){state.answerFilter=af.dataset.answerFilter;go('admin');return}const role=e.target.closest('[data-role]');if(role){if(state.exam){go('exam');return}state.role=+role.dataset.role;go('personal');return}const choice=e.target.closest('[data-choice]');if(choice&&state.page==='exam'){chooseAnswer(+choice.dataset.choice);return}const report=e.target.closest('[data-report]');if(report&&state.adminOK){state.selectedId=report.dataset.report;state.answerFilter='all';go('admin');return}const btn=e.target.closest('[data-act]');if(!btn)return;switch(btn.dataset.act){case 'roles':go('roles');break;case 'admin':if(state.exam){go('exam');break}state.selectedId=null;state.adminTab='overview';go('admin');break;case 'startConfirmed':beginConfirmedExam();break;case 'skip':skipQuestion();break;case 'new':state.role=null;state.selectedId=null;go('roles');break;case 'logout':adminLock();break;case 'showList':if(state.adminOK){state.adminTab='list';state.selectedId=null;go('admin')}break;case 'showStats':if(state.adminOK){state.adminTab='stats';state.selectedId=null;go('admin')}break;case 'backResults':state.selectedId=null;state.answerFilter='all';state.adminTab='list';go('admin');break;case 'server':if(state.adminOK)location.href='asan://setup';break;case 'print':if(state.adminOK)location.href='asan://print';break;}});
function tick(){if(state.exam){if(remaining()<=0){complete(true);return}if(state.page==='exam'){let el=$('#clock');if(el){el.textContent='⏱ '+fmtSecs(remaining());el.classList.toggle('warn',remaining()<=300)}}}}
setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(document.hidden)asanOnBackground();else tick()});window.addEventListener('pagehide',asanOnBackground);window.addEventListener('blur',()=>{if(state.exam&&state.page==='exam'&&document.hidden)asanOnBackground()});
if(state.exam){if(state.exam.qids&&state.exam.qids.length){complete(remaining()<=0,remaining()<=0?'timeout':'background')}else{localStorage.removeItem(K_ACTIVE);state.exam=null}}
render();
</script></body></html>
