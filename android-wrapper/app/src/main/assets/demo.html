"id":"D09","topic":"انبار و موجودی کالا","difficulty":"medium","text":"موجودی اول دوره ۳۰، خرید خالص ۸۰ و موجودی پایان دوره ۲۰ میلیون ریال است. بهای تمام‌شده کالای فروش‌رفته چند میلیون ریال می‌شود؟","options":["۹۰","۱۳۰","۷۰","۶۰"],"answer":0},{"id":"D10","topic":"دارایی ثابت و استهلاک","difficulty":"medium","text":"بهای یک دستگاه ۱۰۰ و ارزش اسقاط ۱۰ میلیون ریال است. عمر مفید ۵ سال و روش خط مستقیم است. استهلاک سالانه چند میلیون ریال است؟","options":["۲۰","۲۲","۱۸","۱۰"],"answer":2},{"id":"D11","topic":"حقوق و دستمزد","difficulty":"easy","text":"اگر حقوق ناخالص ۵۰ و کسورات ۷ میلیون ریال باشد، حقوق خالص پرداختنی چند میلیون ریال است؟","options":["۵۷","۴۳","۵۰","۷"],"answer":1},{"id":"D12","topic":"قانون کار و بیمه","difficulty":"medium","text":"برای محاسبه دقیق حق بیمه حقوق کارکنان در یک سال مشخص، کدام اطلاعات لازم است؟","options":["فقط نام کارگاه","فقط مبلغ فروش","فقط تعداد فاکتورها","مزد مشمول و نرخ‌های قانونی همان دوره"],"answer":3},{"id":"D13","topic":"مالیات‌های مستقیم","difficulty":"medium","text":"کدام اقدام برای رسیدگی مالیاتی قابل اتکاتر است؟","options":["ثبت هزینه بدون مدرک","نگهداری اسناد مثبته هزینه‌ها","حذف فاکتورهای خرید","تغییر تاریخ اسناد پس از رسیدگی"],"answer":1},{"id":"D14","topic":"ارزش افزوده و سامانه مؤدیان","difficulty":"medium","text":"فرض کنید کالای مشمول به مبلغ ۲۰۰ میلیون ریال فروخته شود و نرخ فرضی مالیات ۱۰٪ باشد. مبلغ مالیات چند میلیون ریال است؟","options":["۲۰","۲۲۰","۱۰","۲"],"answer":0},{"id":"D15","topic":"حسابداری صنعتی","difficulty":"medium","text":"مواد مستقیم ۴۰ و دستمزد مستقیم ۳۰ میلیون ریال است. بهای اولیه تولید چند میلیون ریال است؟","options":["۱۰","۱۰۰","۷۰","۴۰"],"answer":2},{"id":"D16","topic":"حسابداری مدیریت و بودجه","difficulty":"hard","text":"قیمت فروش هر واحد ۲۰۰ هزار، هزینه متغیر هر واحد ۱۲۰ هزار و هزینه ثابت کل ۸۰ میلیون ریال است. نقطه سر‌به‌سر چند واحد است؟","options":["۶۶۷","۴۰۰","۱۶۰۰","۱۰۰۰"],"answer":3},{"id":"D17","topic":"پیمانکاری و پروژه","difficulty":"medium","text":"طبق مفروضات قراردادی، هزینه برآوردی کل پروژه ۵۰۰ و هزینه انجام‌شده قابل اتکا ۲۰۰ میلیون ریال است. درصد پیشرفت بر اساس روش هزینه به هزینه چقدر است؟","options":["۶۰٪","۴۰٪","۲۰٪","۸۰٪"],"answer":1},{"id":"D18","topic":"حسابداری شرکت‌ها","difficulty":"easy","text":"ورود نقدی ۱۰۰ میلیون ریال توسط مالک به شرکت چه اثری بر معادله حسابداری دارد؟","options":["دارایی افزایش و سرمایه کاهش","بدهی افزایش و دارایی کاهش","دارایی و حقوق مالکانه افزایش","فقط درآمد افزایش"],"answer":2},{"id":"D19","topic":"حسابرسی و کنترل داخلی","difficulty":"medium","text":"کدام کنترل برای کاهش خطر سوءاستفاده از وجوه نقد مناسب‌تر است؟","options":["تفکیک وظیفه دریافت وجه و ثبت حسابداری","واگذاری همه وظایف به یک نفر","حذف تطبیق بانک","عدم ثبت رسید"],"answer":0},{"id":"D20","topic":"اکسل و تحلیل مالی","difficulty":"easy","text":"برای جمع‌زدن سلول‌های B2 تا B10 در اکسل از کدام فرمول استفاده می‌شود؟","options":["=COUNT(B2:B10)","=SUM(B2:B10)","=AVERAGE(B2:B10)","=MAX(B2:B10)"],"answer":1},{"id":"D21","topic":"نرم‌افزار حسابداری و ERP","difficulty":"medium","text":"برای پیگیری منشأ یک ثبت مالی در نرم‌افزار حسابداری، کدام قابلیت مهم‌تر است؟","options":["تغییر رنگ منو","افزایش اندازه فونت","نمایش گزارش هواشناسی","ردیابی سند و سابقه تغییرات"],"answer":3},{"id":"D22","topic":"ارز و بازرگانی خارجی","difficulty":"hard","text":"شرکت ۱۰۰۰ واحد ارز دریافتنی دارد. نرخ تسعیر هر واحد از ۵۰۰٬۰۰۰ به ۵۲۰٬۰۰۰ ریال افزایش یافته است. سود تسعیر چند میلیون ریال است؟","options":["۵۲۰","۲۰","۵۰۰","۲"],"answer":1},{"id":"D23","topic":"حسابداری کسب‌وکارها","difficulty":"medium","text":"در فروشگاه مواد غذایی، برای کاهش خطای موجودی کالاهای تاریخ‌دار کدام کنترل مؤثرتر است؟","options":["ثبت دوره‌ای موجودی و کنترل تاریخ انقضا","ثبت فقط مبلغ فروش","حذف کد کالا","ثبت کلی خرید بدون اقلام"],"answer":0},{"id":"D24","topic":"بخش عمومی و غیرانتفاعی","difficulty":"medium","text":"کمک مالی که طبق قرارداد فقط باید صرف خرید تجهیزات شود، در گزارشگری مؤسسه غیرانتفاعی چگونه باید مدیریت شود؟","options":["مانند وجه بدون محدودیت","به‌عنوان فروش کالا","با رهگیری محدودیت مصرف مطابق چارچوب مربوط","بدون ثبت در دفاتر"],"answer":2},{"id":"D25","topic":"خطایابی و تصمیم عملی","difficulty":"hard","text":"تراز آزمایشی ۱۲ میلیون ریال اختلاف دارد و یک ثبت بدهکار ۱۲ میلیون ریالی انجام نشده است. راه درست چیست؟","options":["ثبت تصادفی در حساب بانک","شناسایی سند و اصلاح ثبت با مستندات","حذف تراز آزمایشی","دو برابرکردن حساب بستانکار"],"answer":1},{"id":"D26","topic":"اصول تعهدی","difficulty":"hard","text":"خدمات به مبلغ ۸۰ میلیون ریال در اسفند ارائه شده ولی وجه در فروردین دریافت می‌شود. با فرض تحقق شرایط شناسایی، درآمد متعلق به کدام ماه است؟","options":["فروردین","بهمن","اسفند","اردیبهشت"],"answer":2},{"id":"D27","topic":"ذخیره مطالبات","difficulty":"hard","text":"مانده حساب‌های دریافتنی ۲۰۰ میلیون ریال است. ذخیره موردنیاز پایان سال ۵٪ و مانده بستانکار ذخیره قبل از تعدیل ۳ میلیون ریال است. هزینه مطالبات مشکوک‌الوصول چند میلیون ریال است؟","options":["۷","۱۰","۱۳","۳"],"answer":0},{"id":"D28","topic":"انحرافات هزینه","difficulty":"hard","text":"مقدار واقعی مصرف ۱۱۰ واحد، مقدار استاندارد مجاز ۱۰۰ واحد و نرخ استاندارد هر واحد ۲۰ هزار ریال است. انحراف مقداری مواد چند هزار ریال نامساعد است؟","options":["۱۰۰","۱۱۰","۲۰۰","۲۰"],"answer":2},{"id":"D29","topic":"صورت جریان نقد","difficulty":"medium","text":"دریافت وجه نقد از مشتری بابت فروش عادی شرکت معمولاً در کدام گروه صورت جریان وجه نقد قرار می‌گیرد؟","options":["فعالیت‌های عملیاتی","فعالیت‌های سرمایه‌گذاری","فعالیت‌های تأمین مالی","تغییرات غیرنقدی"],"answer":0},{"id":"D30","topic":"کنترل اسناد","difficulty":"medium","text":"در بررسی یک فاکتور خرید قبل از پرداخت، کدام کنترل مناسب است؟","options":["پرداخت بدون سند","تطبیق سفارش، رسید دریافت کالا و فاکتور","ثبت پرداخت به حساب فروش","حذف تأیید مسئول خرید"],"answer":1}];

const state={page:'home',role:1,mode:10,candidate:'',session:[],idx:0,answers:{},result:null,start:0};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page){state.page=page;render();window.scrollTo(0,0)}
function nav(){document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===state.page || (state.page==='exam'&&el.dataset.tab==='roles')))}
function roleCards(){return roles.map((r,i)=>`<div class="card role" data-role="${i}" tabindex="0" role="button" aria-label="انتخاب ${r.label}"><div class="role-icon">${r.icon}</div><div class="role-body"><strong>${r.label}</strong><small>${r.caption}</small></div><span class="chev">‹</span></div>`).join('')}
function home(){return `<section class="hero"><span class="tag">● آماده برای تجربه اولیه</span><h2>استخدام دقیق‌تر،<br>با ارزیابی هوشمند.</h2><p>انتخاب حسابدار، کمک‌حسابدار و کارآموز در یک محیط یکپارچه و حرفه‌ای.</p><button class="primary" data-action="start">شروع آزمون نمونه ←</button></section><div class="section-heading"><h3>نمای کلی سامانه</h3><span>نسخه نمایشی بدون سرور</span></div><div class="stats"><div class="stat"><b>۳</b><span>موقعیت شغلی</span></div><div class="stat"><b>۲۵</b><span>حوزه حسابداری</span></div><div class="stat"><b>۱۰۰</b><span>سؤال در آزمون اصلی</span></div></div><div class="section-heading"><h3>انتخاب موقعیت شغلی</h3><span>شروع آسان</span></div>${roleCards()}<div class="notice"><b>حالت نمایشی آفلاین</b><br>۳۰ سؤال نمونه در برنامه موجود است؛ آزمون نمایشی ۱۰ یا ۲۵ سؤال اجرا می‌شود. آزمون واقعی ۱۰۰ سؤالی و گزارش محرمانه شرکت نیازمند سرور HTTPS است.</div>`}
function rolesPage(){return `<h2 class="page-title">آزمون استخدامی</h2><p class="page-sub">سطح شغلی و طول آزمون نمایشی را انتخاب کن.</p><div class="card"><label class="form-label" for="candidate">نام داوطلب (اختیاری)</label><input class="field" id="candidate" autocomplete="off" placeholder="برای نمونه: داوطلب شماره ۱" value="${esc(state.candidate)}" maxlength="60"><label class="form-label">موقعیت شغلی</label><div class="level-row">${roles.map((r,i)=>`<button class="level ${state.role===i?'selected':''}" data-pick-role="${i}">${r.label}</button>`).join('')}</div><label class="form-label">تعداد سؤال نمونه</label><div class="level-row" style="grid-template-columns:repeat(2,1fr)"><button class="level ${state.mode===10?'selected':''}" data-pick-mode="10">۱۰ سؤال سریع</button><button class="level ${state.mode===25?'selected':''}" data-pick-mode="25">۲۵ سؤال جامع</button></div><p style="margin-top:15px">سؤالات به‌صورت نمایشی با توجه به پاسخ‌های قبلی از نظر دشواری انتخاب می‌شوند؛ این الگوریتم هنوز کالیبره استخدامی نشده است.</p><button class="primary full" style="margin-top:18px" data-action="begin">شروع آزمون نمایشی ←</button></div><div class="notice">پاسخ‌ها فقط تا زمان خروج از این صفحه در حافظه همین اجرا نگهداری می‌شوند. بانک سؤالهای اصلی شرکت در دستگاه وجود ندارد.</div>`}
function chooseNext(){const used=new Set(state.session.map(x=>x.id));const answered=Object.keys(state.answers).length;let desired=roles[state.role].start;if(answered>=2){const recent=state.session.slice(-2).filter(q=>state.answers[q.id]!==undefined);if(recent.length===2){const correct=recent.filter(q=>state.answers[q.id]===q.answer).length;desired=correct===2?'hard':correct===0?'easy':'medium'}}const remaining=QUESTION_BANK.filter(x=>!used.has(x.id));if(!remaining.length)return null;let pick=remaining.filter(q=>q.difficulty===desired);if(!pick.length)pick=remaining;pick.sort((a,b)=>Number(state.session.some(s=>s.topic===a.topic))-Number(state.session.some(s=>s.topic===b.topic)));return pick[0]}
function begin(){state.result=null;state.idx=0;state.answers={};state.session=[];state.start=Date.now();const q=chooseNext();if(q)state.session.push(q);go('exam')}
function examPage(){const q=state.session[state.idx];if(!q)return '<div class="notice">سؤال دیگری در نسخه نمایشی وجود ندارد.</div>';const done=Object.keys(state.answers).length;return `<div class="section-heading"><h3>${esc(roles[state.role].label)}</h3><span>آزمون نمایشی</span></div><div class="question-frame"><div class="q-number"><span class="tag">${esc(q.topic)}</span><span class="small text-muted">سؤال ${state.idx+1} از ${state.mode}</span></div><div class="progress"><div style="width:${100*(state.idx+1)/state.mode}%"></div></div><div class="chips"><span class="chip">سطح ${q.difficulty==='easy'?'آسان':q.difficulty==='medium'?'متوسط':'سخت'}</span><span class="chip">${done} پاسخ ثبت‌شده</span></div><div class="stem">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="choice ${state.answers[q.id]===i?'selected':''}" data-choice="${i}"><span class="bullet">${'ابجد'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="exam-nav"><button class="secondary" data-action="prev" ${state.idx===0?'disabled':''}>سؤال قبل</button><button class="primary" data-action="next" ${state.answers[q.id]===undefined?'disabled':''}>${state.idx+1===state.mode?'ثبت و مشاهده نتیجه':'سؤال بعد ←'}</button></div><p class="small text-muted" style="text-align:center">در آزمون واقعی، پاسخ صحیح فقط برای مسئول استخدام قابل مشاهده است.</p>`}
function next(){if(state.idx+1===state.mode){finish();return}state.idx++;if(!state.session[state.idx]){let q=chooseNext();if(q)state.session.push(q)}render();window.scrollTo(0,0)}
function finish(){const all=state.session.slice(0,state.mode);const right=all.filter(q=>state.answers[q.id]===q.answer).length;const percent=Math.round(100*right/all.length);state.result={right,total:all.length,percent,role:state.role,seconds:Math.floor((Date.now()-state.start)/1000),name:state.candidate};go('report')}
function report(){if(!state.result)return `<h2 class="page-title">نتایج</h2><p class="page-sub">هنوز آزمون نمایشی ثبت نشده است.</p><div class="card"><h3>برای مشاهده نتیجه، ابتدا یک آزمون نمونه انجام بده.</h3><p>آزمون واقعی و گزارش محرمانه شرکت فقط با اتصال به سرور فعال می‌شود.</p><button class="primary full" style="margin-top:15px" data-action="start">شروع آزمون</button></div>`;const r=state.result;return `<h2 class="page-title">نتیجه آزمون نمایشی</h2><p class="page-sub">این نمره فقط برای آزمودن رابط کاربری است؛ مبنای تصمیم استخدامی نیست.</p><div class="result-header"><div class="small">امتیاز نمونه</div><div class="score">${r.percent}٪</div><b>${r.right} پاسخ صحیح از ${r.total} سؤال</b><p>${esc(roles[r.role].label)}${r.name?' — '+esc(r.name):''}</p></div><div class="card"><h3>خلاصه عملکرد</h3><div class="stats" style="margin-top:15px"><div class="stat"><b>${r.right}</b><span>صحیح</span></div><div class="stat"><b>${r.total-r.right}</b><span>غلط</span></div><div class="stat"><b>${Math.floor(r.seconds/60)}</b><span>دقیقه</span></div></div><div class="notice">در نسخه واقعی، نمره کل به‌همراه عملکرد هر ۲۵ حوزه برای مسئول استخدام محاسبه می‌شود. این صفحه فقط پیش‌نمایش آفلاین است.</div><button class="primary full" data-action="start" style="margin-top:15px">شروع مجدد آزمون</button></div>`}
function settings(){return `<h2 class="page-title">تنظیمات اتصال</h2><p class="page-sub">نسخه نمایشی همین حالا بدون اینترنت فعال است.</p><div class="card"><div class="tag">● حالت نمایشی آفلاین فعال</div><h3 style="margin-top:16px">اتصال به سرور اختصاصی شرکت</h3><p>برای آزمون ۱۰۰ سؤالی رسمی، مدیریت داوطلبان، ثبت نتایج و پاسخنامه محرمانه، باید آدرس HTTPS سرور شرکت تنظیم شود.</p><button class="primary full" style="margin-top:16px" data-action="server">تنظیم آدرس سرور ←</button></div><div class="card"><h3>درباره آسان</h3><p>نسخه ۲.۱.۳ آزمایشی — تم #50C787 و سفید</p><hr class="separator"><div class="chips"><span class="chip">۳ سطح شغلی</span><span class="chip">۳۰ سؤال نمونه</span><span class="chip">بدون ذخیره داده شخصی در حالت آفلاین</span></div></div><div class="notice">آزمون نمایشی شامل سؤالات عمومی قابل مشاهده در کد برنامه است؛ برای مصاحبه رسمی و رتبه‌بندی واقعی استفاده نشود.</div>`}
function render(){nav();$('#root').innerHTML=state.page==='home'?home():state.page==='roles'?rolesPage():state.page==='exam'?examPage():state.page==='report'?report():settings();$('#modeBtn').textContent=state.page==='exam'?'◉ آزمون آزمایشی':'◉ نسخه نمایشی'}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){go(tab.dataset.tab);return}const role=e.target.closest('[data-role]');if(role){state.role=+role.dataset.role;go('roles');return}const pr=e.target.closest('[data-pick-role]');if(pr){state.role=+pr.dataset.pickRole;render();return}const pm=e.target.closest('[data-pick-mode]');if(pm){state.mode=+pm.dataset.pickMode;render();return}const choice=e.target.closest('[data-choice]');if(choice){const q=state.session[state.idx];state.answers[q.id]=+choice.dataset.choice;render();return}const action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case 'start':go('roles');break;case 'begin':state.candidate=$('#candidate')?.value?.trim()||'';begin();break;case 'next':next();break;case 'prev':state.idx=Math.max(0,state.idx-1);render();break;case 'server':location.href='asan://setup';break;}});
document.addEventListener('keydown',e=>{const r=e.target.closest('[data-role]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.role=+r.dataset.role;go('roles')}});
render();
</script></body></html>
