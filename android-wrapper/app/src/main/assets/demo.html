splay:block;font-weight:750;font-size:12px;margin:15px 0 5px}.field{width:100%;height:52px;border:1px solid #d7e7dc;border-radius:13px;padding:0 14px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#50C787;box-shadow:0 0 0 3px #50c78733}.field[dir=ltr]{text-align:left}.field-small{max-width:210px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.help{color:var(--muted);font-size:11px}.check{display:flex;gap:9px;align-items:flex-start;margin:15px 0;font-size:12px}.check input{margin-top:7px;accent-color:#2eaa68}.steps{display:flex;gap:7px;align-items:center;margin:20px 0}.step{background:white;border:1px solid var(--line);border-radius:11px;color:#8ba097;font-size:11px;padding:5px 10px}.step.active{background:#d9f6e6;color:#116846;border-color:#79d8a7;font-weight:800}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.counter{background:#eaf7ef;color:#166743;border-radius:12px;padding:5px 11px;font-weight:900;font-variant-numeric:tabular-nums}.counter.warn{color:#ac4141;background:#fff2f2}.qtext{font-weight:850;line-height:2.1;font-size:16px;margin:17px 0}.opt{width:100%;min-height:56px;text-align:right;border:1px solid var(--line);border-radius:15px;margin:8px 0;padding:12px;display:flex;align-items:center;gap:10px;background:white;color:var(--ink);font-size:13px}.opt.sel{background:#eafaf0;border-color:#50C787}.opt em{font-style:normal;font-weight:850;border:1px solid #d9ebdf;border-radius:10px;width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;color:#317453}.opt.sel em{background:var(--green);border-color:var(--green);color:#06442d}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{border:1px solid var(--line);border-radius:16px;background:#fff;padding:11px;text-align:center}.metric b{display:block;font-size:22px;line-height:1.5}.metric small{color:var(--muted);font-size:10px}.divider{height:1px;background:var(--line);margin:18px 0}.muted{colo const QUESTION_BANK = [{"id":"D01","topic":"اصول و مفاهیم","difficulty":"easy","text":"مانده عادی حساب «هزینه اجاره» در دفاتر چه ماهیتی دارد؟","options":["بستانکار","بدهکار","بدون ماهیت","همیشه صفر"],"answer":1},{"id":"D02","topic":"ثبت اسناد و دفاتر","difficulty":"easy","text":"شرکت یک میز اداری را نقداً به مبلغ ۲۰ میلیون ریال خریداری می‌کند. ثبت صحیح کدام است؟","options":["اثاثه بدهکار / صندوق بستانکار","صندوق بدهکار / اثاثه بستانکار","هزینه حقوق بدهکار / فروش بستانکار","بانک بدهکار / سرمایه بستانکار"],"answer":0},{"id":"D03","topic":"اصلاح و بستن حساب‌ها","difficulty":"medium","text":"بیمه یک‌ساله به مبلغ ۱۲۰ میلیون ریال در ابتدای سال به‌عنوان پیش‌پرداخت ثبت شده است. پس از گذشت ۳ ماه، هزینه بیمه چند میلیون ریال است؟","options":["۱۲۰","۹۰","۳۰","۱۰"],"answer":2},{"id":"D04","topic":"صورت‌های مالی","difficulty":"easy","text":"کدام رابطه، معادله اصلی حسابداری است؟","options":["دارایی = بدهی + حقوق مالکانه","دارایی = درآمد + هزینه","سود = دارایی + بدهی","سرمایه = فروش + موجودی"],"answer":0},{"id":"D05","topic":"استانداردهای حسابداری","difficulty":"medium","text":"با فرض مبنای تعهدی، درآمد خدمات معمولاً در چه زمانی شناسایی می‌شود؟","options":["هنگام وصول وجه در همه شرایط","پس از پایان سال مالی","هنگام ارائه خدمت و تحقق شرایط شناسایی","فقط زمان صدور چک"],"answer":2},{"id":"D06","topic":"خرید و فروش","difficulty":"easy","text":"شرکت ۵۰ میلیون ریال کالا را نسیه فروخته است. صرف‌نظر از بهای تمام‌شده و مالیات، کدام حساب بدهکار می‌شود؟","options":["فروش","حساب‌های دریافتنی","حساب‌های پرداختنی","بانک"],"answer":1},{"id":"D07","topic":"بانک و خزانه","difficulty":"medium","text":"در مغایرت بانکی، «وجه واریزی در راه» باید به کدام مانده اضافه شود؟","options":["مانده دفاتر شرکت","مانده صورت‌حساب بانک","هزینه مالی","حساب فروش"],"answer":1},{"id":"D08","topic":"حساب‌های دریافتنی و پرداختنی","difficulty":"easy","text":"وجهی که مشتری بابت فروش نسیه به شرکت بدهکار است، در چه حسابی ثبت می‌شود؟","options":["حساب‌های پرداختنی","پیش‌دریافت درآمد","حساب‌های دریافتنی","سرمایه"],"answer":2},{"id":"D09","topic":"انبار و موجودی کالا","difficulty":"medium","text":"موجودی اول دوره ۳۰، خرید خالص ۸۰ و موجودی پایان دوره ۲۰ میلیون ریال است. بهای تمام‌شده کالای فروش‌رفته چند میلیون ریال می‌شود؟","options":["۹۰","۱۳۰","۷۰","۶۰"],"answer":0},{"id":"D10","topic":"دارایی ثابت و استهلاک","difficulty":"medium","text":"بهای یک دستگاه ۱۰۰ و ارزش اسقاط ۱۰ میلیون ریال است. عمر مفید ۵ سال و روش خط مستقیم است. استهلاک سالانه چند میلیون ریال است؟","options":["۲۰","۲۲","۱۸","۱۰"],"answer":2},{"id":"D11","topic":"حقوق و دستمزد","difficulty":"easy","text":"اگر حقوق ناخالص ۵۰ و کسورات ۷ میلیون ریال باشد، حقوق خالص پرداختنی چند میلیون ریال است؟","options":["۵۷","۴۳","۵۰","۷"],"answer":1},{"id":"D12","topic":"قانون کار و بیمه","difficulty":"medium","text":"برای محاسبه دقیق حق بیمه حقوق کارکنان در یک سال مشخص، کدام اطلاعات لازم است؟","options":["فقط نام کارگاه","فقط مبلغ فروش","فقط تعداد فاکتورها","مزد مشمول و نرخ‌های قانونی همان دوره"],"answer":3},{"id":"D13","topic":"مالیات‌های مستقیم","difficulty":"medium","text":"کدام اقدام برای رسیدگی مالیاتی قابل اتکاتر است؟","options":["ثبت هزینه بدون مدرک","نگهداری اسناد مثبته هزینه‌ها","حذف فاکتورهای خرید","تغییر تاریخ اسناد پس از رسیدگی"],"answer":1},{"id":"D14","topic":"ارزش افزوده و سامانه مؤدیان","difficulty":"medium","text":"فرض کنید کالای مشمول به مبلغ ۲۰۰ میلیون ریال فروخته شود و نرخ فرضی مالیات ۱۰٪ باشد. مبلغ مالیات چند میلیون ریال است؟","options":["۲۰","۲۲۰","۱۰","۲"],"answer":0},{"id":"D15","topic":"حسابداری صنعتی","difficulty":"medium","text":"مواد مستقیم ۴۰ و دستمزد مستقیم ۳۰ میلیون ریال است. بهای اولیه تولید چند میلیون ریال است؟","options":["۱۰","۱۰۰","۷۰","۴۰"],"answer":2},{"id":"D16","topic":"حسابداری مدیریت و بودجه","difficulty":"hard","text":"قیمت فروش هر واحد ۲۰۰ هزار، هزینه متغیر هر واحد ۱۲۰ هزار و هزینه ثابت کل ۸۰ میلیون ریال است. نقطه سر‌به‌سر چند واحد است؟","options":["۶۶۷","۴۰۰","۱۶۰۰","۱۰۰۰"],"answer":3},{"id":"D17","topic":"پیمانکاری و پروژه","difficulty":"medium","text":"طبق مفروضات قراردادی، هزینه برآوردی کل پروژه ۵۰۰ و هزینه انجام‌شده قابل اتکا ۲۰۰ میلیون ریال است. درصد پیشرفت بر اساس روش هزینه به هزینه چقدر است؟","options":["۶۰٪","۴۰٪","۲۰٪","۸۰٪"],"answer":1},{"id":"D18","topic":"حسابداری شرکت‌ها","difficulty":"easy","text":"ورود نقدی ۱۰۰ میلیون ریال توسط مالک به شرکت چه اثری بر معادله حسابداری دارد؟","options":["دارایی افزایش و سرمایه کاهش","بدهی افزایش و دارایی کاهش","دارایی و حقوق مالکانه افزایش","فقط درآمد افزایش"],"answer":2},{"id":"D19","topic":"حسابرسی و کنترل داخلی","difficulty":"medium","text":"کدام کنترل برای کاهش خطر سوءاستفاده از وجوه نقد مناسب‌تر است؟","options":["تفکیک وظیفه دریافت وجه و ثبت حسابداری","واگذاری همه وظایف به یک نفر","حذف تطبیق بانک","عدم ثبت رسید"],"answer":0},{"id":"D20","topic":"اکسل و تحلیل مالی","difficulty":"easy","text":"برای جمع‌زدن سلول‌های B2 تا B10 در اکسل از کدام فرمول استفاده می‌شود؟","options":["=COUNT(B2:B10)","=SUM(B2:B10)","=AVERAGE(B2:B10)","=MAX(B2:B10)"],"answer":1},{"id":"D21","topic":"نرم‌افزار حسابداری و ERP","difficulty":"medium","text":"برای پیگیری منشأ یک ثبت مالی در نرم‌افزار حسابداری، کدام قابلیت مهم‌تر است؟","options":["تغییر رنگ منو","افزایش اندازه فونت","نمایش گزارش هواشناسی","ردیابی سند و سابقه تغییرات"],"answer":3},{"id":"D22","topic":"ارز و بازرگانی خارجی","difficulty":"hard","text":"شرکت ۱۰۰۰ واحد ارز دریافتنی دارد. نرخ تسعیر هر واحد از ۵۰۰٬۰۰۰ به ۵۲۰٬۰۰۰ ریال افزایش یافته است. سود تسعیر چند میلیون ریال است؟","options":["۵۲۰","۲۰","۵۰۰","۲"],"answer":1},{"id":"D23","topic":"حسابداری کسب‌وکارها","difficulty":"medium","text":"در فروشگاه مواد غذایی، برای کاهش خطای موجودی کالاهای تاریخ‌دار کدام کنترل مؤثرتر است؟","options":["ثبت دوره‌ای موجودی و کنترل تاریخ انقضا","ثبت فقط مبلغ فروش","حذف کد کالا","ثبت کلی خرید بدون اقلام"],"answer":0},{"id":"D24","topic":"بخش عمومی و غیرانتفاعی","difficulty":"medium","text":"کمک مالی که طبق قرارداد فقط باید صرف خرید تجهیزات شود، در گزارشگری مؤسسه غیرانتفاعی چگونه باید مدیریت شود؟","options":["مانند وجه بدون محدودیت","به‌عنوان فروش کالا","با رهگیری محدودیت مصرف مطابق چارچوب مربوط","بدون ثبت در دفاتر"],"answer":2},{"id":"D25","topic":"خطایابی و تصمیم عملی","difficulty":"hard","text":"تراز آزمایشی ۱۲ میلیون ریال اختلاف دارد و یک ثبت بدهکار ۱۲ میلیون ریالی انجام نشده است. راه درست چیست؟","options":["ثبت تصادفی در حساب بانک","شناسایی سند و اصلاح ثبت با مستندات","حذف تراز آزمایشی","دو برابرکردن حساب بستانکار"],"answer":1},{"id":"D26","topic":"اصول تعهدی","difficulty":"hard","text":"خدمات به مبلغ ۸۰ میلیون ریال در اسفند ارائه شده ولی وجه در فروردین دریافت می‌شود. با فرض تحقق شرایط شناسایی، درآمد متعلق به کدام ماه است؟","options":["فروردین","بهمن","اسفند","اردیبهشت"],"answer":2},{"id":"D27","topic":"ذخیره مطالبات","difficulty":"hard","text":"مانده حساب‌های دریافتنی ۲۰۰ میلیون ریال است. ذخیره موردنیاز پایان سال ۵٪ و مانده بستانکار ذخیره قبل از تعدیل ۳ میلیون ریال است. هزینه مطالبات مشکوک‌الوصول چند میلیون ریال است؟","options":["۷","۱۰","۱۳","۳"],"answer":0},{"id":"D28","topic":"انحرافات هزینه","difficulty":"hard","text":"مقدار واقعی مصرف ۱۱۰ واحد، مقدار استاندارد مجاز ۱۰۰ واحد و نرخ استاندارد هر واحد ۲۰ هزار ریال است. انحراف مقداری مواد چند هزار ریال نامساعد است؟","options":["۱۰۰","۱۱۰","۲۰۰","۲۰"],"answer":2},{"id":"D29","topic":"صورت جریان نقد","difficulty":"medium","text":"دریافت وجه نقد از مشتری بابت فروش عادی شرکت معمولاً در کدام گروه صورت جریان وجه نقد قرار می‌گیرد؟","options":["فعالیت‌های عملیاتی","فعالیت‌های سرمایه‌گذاری","فعالیت‌های تأمین مالی","تغییرات غیرنقدی"],"answer":0},{"id":"D30","topic":"کنترل اسناد","difficulty":"medium","text":"در بررسی یک فاکتور خرید قبل از پرداخت، کدام کنترل مناسب است؟","options":["پرداخت بدون سند","تطبیق سفارش، رسید دریافت کالا و فاکتور","ثبت پرداخت به حساب فروش","حذف تأیید مسئول خرید"],"answer":1},{"id":"P031","topic":"اصول و مفاهیم","difficulty":"easy","text":"شرکتی 80 میلیون ریال دارایی و 30 میلیون ریال بدهی دارد. حقوق مالکانه چند میلیون ریال است؟","options":["30","80","110","50"],"answer":3,"explanation":"حقوق مالکانه = دارایی منهای بدهی = 50 میلیون ریال."},{"id":"P032","topic":"صورت‌های مالی","difficulty" },{"id":"P039","topic":"بانک و خزانه","difficulty":"hard","text":"مانده بانک در دفاتر شرکت 80 میلیون ریال است. بانک 8 میلیون ریال کارمزد کسر و 3 میلیون ریال سود بانکی واریز کرده که در دفاتر ثبت نشده‌اند. مانده اصلاح‌شده دفاتر چقدر می‌شود؟","options":["75","69","91","85"],"answer":0,"explanation":"از دفاتر هزینه کارمزد کم و سود اضافه می‌شود: 75."},{"id":"P040","topic":"اصلاح و بستن حساب‌ها","difficulty":"medium","text":"بیمه ۱۲ماهه به مبلغ 96 میلیون ریال در حساب پیش‌پرداخت ثبت شده است. پس از سپری‌شدن 2 ماه، هزینه بیمه شناسایی‌شده چند میلیون ریال است؟","options":["8","80","96","16"],"answer":3,"explanation":"سهم هزینه = کل پیش‌پرداخت × 2/۱۲ = 16."},{"id":"P041","topic":"ارز و بازرگانی خارجی","difficulty":"hard","text":"شرکت 1000 واحد ارز دریافتنی دارد. نرخ هر واحد از ۵۰۰٬۰۰۰ ریال به 502,000 ریال افزایش یافته است. سود تسعیر چند میلیون ریال است؟","options":["4","2","3","20"],"answer":1,"explanation":"تفاوت نرخ × تعداد ارز = 1000 × 2000 ریال = 2 میلیون ریال."},{"id":"P042","topic":"پیمانکاری و پروژه","difficulty":"medium","text":"صورت‌وضعیت تأییدشده پیمانکار 800 میلیون ریال است و بر اساس قرارداد فرضی، ۱۰٪ آن به‌عنوان سپرده حسن انجام کار نگهداری می‌شود. مبلغ قابل پرداخت پیش از سایر کسورات چند میلیون ریال است؟","options":["800","880","720","80"],"answer":2,"explanation":"۹۰٪ صورت وضعیت = 720."},{"id":"P043","topic":"حسابداری مدیریت و بودجه","difficulty":"hard","text":"هزینه ثابت دوره 800 میلیون ریال، قیمت فروش هر واحد 20 و هزینه متغیر هر واحد 10 میلیون ریال است. نقطه سربه‌سر چند واحد است؟","options":["100","40","80","160"],"answer":2,"explanation":"نقطه سربه‌سر = هزینه ثابت ÷ (قیمت فروش − هزینه متغیر) = 80 واحد."},{"id":"P044","topic":"دریافتنی‌ها و پرداختنی‌ها","difficulty":"medium","text":"مانده ناخالص حساب‌های دریافتنی 800 میلیون ریال است. شرکت بر اساس برآورد داخلی خود، ۵٪ را مشکوک‌الوصول می‌داند. ذخیره لازم چند میلیون ریال است؟","options":["160","40","80","800"],"answer":1,"explanation":"۵٪ × 800 = 40."},{"id":"P045","topic":"صنعتی و بهای تمام‌شده","difficulty":"medium const roles=[{label:'کارآموز حسابداری',icon:'✦',desc:'ارزیابی پایه، ثبت‌های اولیه و مهارت‌های عملی',start:'easy'},{label:'کمک‌حسابدار',icon:'▦',desc:'ثبت اسناد، خزانه، مغایرت بانکی، اکسل و عملیات',start:'medium'},{label:'حسابدار',icon:'◈',desc:'تحلیل مالی، مالیات، بهای تمام‌شده و کنترل',start:'hard'}];
const N=100, DEFAULT_MINUTES=90, K_RECORDS='asan:records:v214', K_ACTIVE='asan:active:v214', K_PIN='asan:pin:v214', K_CONFIG='asan:settings:v214';

function getJSON(key,def){try{let s=localStorage.getItem(key);return s?JSON.parse(s):def}catch{return def}}
function setJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{alert('فضای ذخیره‌سازی دستگاه در دسترس نیست. ثبت نتایج ممکن نیست.');return false}}
function randId(){return 'AS-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}
const state={page:'roles',role:null,profile:null,exam:getJSON(K_ACTIVE,null),idx:0,adminOK:false,selectedId:null,modal:'',error:''};
function setting(){return getJSON(K_CONFIG,{minutes:DEFAULT_MINUTES})}
function records(){let r=getJSON(K_RECORDS,[]);return Array.isArray(r)?r:[]}
function saveActive(){if(state.exam)return setJSON(K_ACTIVE,state.exam);return true}
function go(page){state.page=page;state.error='';render();window.scrollTo(0,0)}
function remaining(){return state.exam?Math.max(0,Math.ceil((state.exam.deadline-Date.now())/1000)):0}
function fmtSecs(n){let min=Math.floor(n/60),sec=n%60;return String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function profileRole(){return roles[state.role||0].label}
function stepper(active){return `<div class="steps"><span class="step ${active===1?'active':''}">۱. موقعیت</span><span class="step ${active===2?'active':''}">۲. مشخصات</span><span class="step ${active===3?'active':''}">۳. آزمون</span><span class="step ${active===4?'active':''}">۴. پایان</span></div>`}
function rolesPage(){return `<div class="eyebrow">مرحله اول · انتخاب شغل</div><h1 class="title">برای کدام موقعیت درخواست دارید؟</h1><p class="sub">پس از انتخاب جایگاه، مشخصات خود را ثبت کرده و آزمون زمان‌دار آغاز می‌شود.</p>${stepper(1)}${roles.map((r,i)=>`<button class="card role" data-role="${i}"><span class="role-icon">${r.icon}</span><span style="flex:1"><strong>${r.label}</strong><small>${r.desc}</small></span><span class="arrow">‹</span></button>`).join('')}<div class="card hero"><span class="pill">آزمون آزمایشی</span><h3>۱۰۰ سؤال چهارگزینه‌ای</h3><p>زمان پیش‌فرض ${setting().minutes} دقیقه · سطح دشواری متناسب با موقعیت و پاسخ‌های قبلی تغییر می‌کند.</p></div><div class="notice">این نسخه در حالت آفلاین و با بانک سؤالات نمونه عمومی کار می‌کند. برای آزمون رسمی شرکتی و مشاهده نتایج از دستگاه دیگر، سرور امن لازم است.</div>`}
function personalPage(){return `${stepper(2)}<div class="eyebrow">مرحله دوم · اطلاعات داوطلب</div><h1 class="title">فرم ثبت‌نام آزمون</h1><p class="sub">موقعیت انتخاب‌شده: <b>${esc(profileRole())}</b></p><form id="personalForm" class="card"><label class="label" for="name">نام و نام خانوادگی *</label><input class="field" id="name" name="name" required minlength="3" maxlength="80" autocomplete="name" placeholder="نام کامل"><label class="label" for="mobile">شماره تماس *</label><input class="field" id="mobile" name="mobile" dir="ltr" inputmode="tel" type="tel" required maxlength="18" placeholder="09123456789"><div class="grid"><div><label class="label" for="education">آخرین مدرک تحصیلی *</label><select class="field" id="education" name="education" required><option value="">انتخاب کنید</option><option>دیپلم</option><option>کاردانی</option><option>کارشناسی</option><option>کارشناسی ارشد</option><option>دکتری</option><option>سایر</option></select></div><div><label class="label" for="experience">سابقه حسابداری *</label><select class="field" id="experience" name="experience" required><option value="">انتخاب کنید</option><option>بدون سابقه</option><option>کمتر از ۱ سال</option><option>۱ تا ۳ سال</option><option>۳ تا ۵ سال</option><option>بیش از ۵ سال</option></select></div></div><label class="label" for="city">شهر محل سکونت (اختیاری)</label><input class="field" id="city" name="city" maxlength="60" placeholder="مثلاً اراک"><label class="check"><input type="checkbox" id="consent" required> <span>موافقم مشخصات و پاسخ‌های آزمون من روی این دستگاه برای بررسی مسئول استخدام ذخیره شود.</span></label><div class="notice">آزمون شامل ۱۰۰ سؤال و ${setting().minutes} دقیقه زمان است. با پایان زمان، پاسخ‌ها خودکار ثبت می‌شوند و پاسخنامه به داوطلب نمایش داده نمی‌شود.</div><div id="formError" class="tiny" style="color:var(--red)"></div><div class="flex"><button type="button" class="secondary" data-act="roles">بازگشت</button><button class="primary" style="flex:1" type="submit">ثبت اطلاعات و شروع آزمون ←</button></div></form>`}
function chooseNext(){let e=state.exam;if(!e)return null;const used=new Set(e.qids),counts={};for(let id of e.qids){const q=QUESTION_BANK.find(x=>x.id===id);if(q)counts[q.topic]=(counts[q.topic]||0)+1}let desired=roles[e.role].start;const done=e.qids.filter(id=>e.answers[id]!==undefined).slice(-2);if(done.length===2){const n=done.reduce((x,id)=>x+(e.answers[id]===QUESTION_BANK.find(q=>q.id===id).answer?1:0),0);desired=n===2?'hard':n===0?'easy':'medium'}let pool=QUESTION_BANK.filter(q=>!used.has(q.id));if(!pool.length)return null;pool.sort((a,b)=>{const x=(a.difficulty===desired?0:1)-(b.difficulty===desired?0:1);if(x)return x;const y=(counts[a.topic]||0)-(counts[b.topic]||0);if(y)return y;return ((a.id.charCodeAt(1)*11+e.seed)%53)-((b.id.charCodeAt(1)*11+e.seed)%53)});return pool[0]}
function startExam(form){let f=new FormData(form);let name=String(f.get('name')||'').trim().replace(/\s+/g,' '),mobile=String(f.get('mobile')||'').trim().replace(/[\u06f0-\u06f9]/g,x=>String(x.charCodeAt(0)-0x6f0)).replace(/[\u0660-\u0669]/g,x=>String(x.charCodeAt(0)-0x660));if(name.length<3||!/^\+?[0-9\- ]{10,18}$/.test(mobile)){alert('نام کامل و شماره تماس معتبر وارد کنید.');return}let profile={name,mobile,education:f.get('education'),experience:f.get('experience'),city:String(f.get('city')||'').trim()};if(!profile.education||!profile.experience||!$('#consent').checked){alert('تمام موارد ضروری را تکمیل و رضایت را تأیید کنید.');return}let start=Date.now();state.exam={id:randId(),role:state.role,profile,start,deadline:start+setting().minutes*60000,minutes:setting().minutes,qids:[],answers:{},seed:Math.floor(Math.random()*99999)};let q=chooseNext();if(!q)throw new Error('Question bank missing');state.exam.qids.push(q.id);state.idx=0;if(!saveActive())return;go('exam')}
function questionOf(id){return QUESTION_BANK.find(q=>q.id===id)}
function examPage(){let e=state.exam;if(!e)return rolesPage();let q=questionOf(e.qids[state.idx]);if(!q)return '<div class="notice danger">سؤالی برای نمایش پیدا نشد.</div>';let answered=Object.keys(e.answers).length;return `<div class="row" style="margin:20px 0 8px"><span class="pill">${esc(roles[e.role].label)}</span><span class="counter ${remaining()<=300?'warn':''}" id="clock">⏱ ${fmtSecs(remaining())}</span></div>${stepper(3)}<div class="row"><div><b>${esc(e.profile.name)}</b><div class="tiny muted">آزمون شماره ${esc(e.id)}</div></div><span class="tiny muted">سؤال ${state.idx+1} از ${N}</span></div><div class="bar"><div style="width:${Math.max(1,100*state.idx/N)}%"></div></div><div class="card"><div class="row"><span class="pill">${esc(q.topic)}</span><span class="pillgray">${q.difficulty==='easy'?'آسان':q.difficulty==='medium'?'متوسط':'سخت'}</span></div><div class="qtext">${esc(q.text)}</div>${q.options.map((v,i)=>`<button class="opt ${e.answers[q.id]===i?'sel':''}" data-choice="${i}"><em>${'ابجد'[i]}</em><span>${esc(v)}</span></button>`).join('')}</div><div class="row tiny muted"><span>${answered} پاسخ ثبت شده</span><span>بدون نمره منفی</span></div><div class="grid" style="margin-top:15px"><button class="secondary" data-act="prev" ${state.idx===0?'disabled':''}>سؤال قبلی</button><button class="primary" data-act="next">${state.idx+1===N?'پایان و ثبت آزمون':'سؤال بعدی ←'}</button></div><button class="secondary full" data-act="submit" style="margin-top:13px">پایان زودهنگام و ثبت پاسخ‌ها</button><div class="notice">تا پایان آزمون، پاسخ‌های شما روی همین دستگاه ذخیره می‌شوند. درصورت خروج و بازگشت، زمان‌سنج ادامه دارد.</div>`}
function chooseAnswer(index){let e=state.exam,q=questionOf(e.qids[state.idx]);if(!q)return;e.answers[q.id]=index;saveActive();render()}
function moveNext(){let e=state.exam;if(!e)return;if(remaining()<=0){complete(true);return}if(state.idx+1>=N){if(confirm('آزمون پایان یابد و پاسخ‌ها برای مسئول استخدام ثبت شود؟'))complete(false);return}if(!e.qids[state.idx+1]){let q=chooseNext();if(q)e.qids.push(q.id)}state.idx++;saveActive();render();window.scrollTo(0,0)}
function complete(timedOut){let e=state.exam;if(!e)return;let now=Date.now(),answers=e.qids.map(id=>{let q=questionOf(id);return {id,text:q.text,topic:q.topic,difficulty:q.difficulty,options:q.options,selected:e.answers[id]===undefined?null:e.answers[id],correct:q.answer,explanation:q.explanation||''}});let right=answers.filter(a=>a.selected===a.correct).length;let result={id:e.id,role:e.role,profile:e.profile,start:e.start,end:now,durationSeconds:Math.max(0,Math.floor((now-e.start)/1000)),total:N,answered:answers.filter(a=>a.selected!==null).length,right,wrong:answers.filter(a=>a.selected!==null&&a.selected!==a.correct).length,percent:Math.round(right*100/N),timedOut:!!timedOut,answers};let rec=records();rec.unshift(result);if(!setJSON(K_RECORDS,rec)){return}localStorage.removeItem(K_ACTIVE);state.exam=null;state.idx=0;state.selectedId=result.id;state.adminOK=false;go('finished')}
function finishedPage(){return `${stepper(4)}<div class="card" style="text-align:center;margin-top:35px;padding:34px 22px"><div style="font-size:48px;color:#2bae72">✓</div><h2>آزمون شما ثبت شد</h2><p>از شرکت در آزمون استخدامی آسان سپاسگزاریم.</p><div class="notice">پاسخ‌ها و نتیجه برای مشاهده مسئول استخدام روی همین دستگاه ثبت شد. نمره و کلید پاسخ برای داوطلب نمایش داده نمی‌شود.</div><p class="tiny">کد پیگیری: <b>${esc(state.selectedId||'')}</b></p><button class="primary full" data-act="new" style="margin-top:17px">ثبت داوطلب بعدی</button></div>`}
async function derivePin(pin,salt){if(!crypto||!crypto.subtle)throw new Error('رمزنگاری در این دستگاه در دسترس نیست');let enc=new TextEncoder(),material=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);let raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},material,256);return Array.from(new Uint8Array(raw)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function adminPage(){if(!state.adminOK){let exists=!!localStorage.getItem(K_PIN);return `<div class="eyebrow">ویژه مسئول استخدام</div><h1 class="title">${exists?'ورود به پنل مدیریت':'فعال‌سازی پنل مدیریت'}</h1><p class="sub">پاسخ‌های داوطلبان فقط از این بخش بررسی می‌شوند.</p><form id="pinForm" class="card"><h3>${exists?'کد ۶ رقمی مدیریت':'تعیین کد ۶ رقمی مدیریت'}</h3><label class="label" for="pin">کد مدیریت</label><input class="field" type="password" inputmode="numeric" id="pin" minlength="6" maxlength="6" pattern="[0-9]{6}" required autocomplete="off" placeholder="● ● ● ● ● ●">${exists?'':`<label class="label" for="confirmPin">تکرار کد</label><input class="field" type="password" inputmode="numeric" id="confirmPin" minlength="6" maxlength="6" pattern="[0-9]{6}" required autocomplete="off" placeholder="تکرار کد">`}<p id="adminError" style="color:var(--red)"></p><button class="primary full" type="submit">${exists?'ورود به مدیریت':'ذخیره کد مدیریت'}</button></form><div class="notice danger">اطلاعات آفلاین روی این دستگاه نگهداری می‌شود. حفاظت با PIN در این نسخه آزمایشی جایگزین امنیت سرور نیست. پیش از تحویل دستگاه به داوطلب، کد مدیریت را تنظیم کنید.</div><button class="secondary full" data-act="roles">بازگشت به انتخاب شغل</button>`}return adminList()}
function adminList(){let r=records(),selected=r.find(x=>x.id===state.selectedId);if(selected)return detailPage(selected);return `<div class="row" style="margin-top:25px"><div><div class="eyebrow" style="margin:0">پنل ویژه کارفرما</div><h1 class="title">نتایج آزمون‌ها</h1></div><button class="secondary" data-act="logout">خروج امن</button></div><p class="sub">نتایج روی همین دستگاه، بدون اتصال به سرور ثبت شده‌اند.</p><div class="grid3"><div class="metric"><b>${r.length}</b><small>داوطلب</small></div><div class="metric"><b>${r.length?Math.round(r.reduce((s,x)=>s+x.percent,0)/r.length):0}٪</b><small>میانگین</small></div><div class="metric"><b>${r.filter(x=>x.timedOut).length}</b><small>اتمام زمان</small></div></div><div class="card"><div class="row"><h3>فهرست داوطلبان</h3><span class="pill">${r.length} آزمون</span></div>${r.length?r.map(x=>`<button class="listrow" data-report="${esc(x.id)}"><span><b>${esc(x.profile.name)}</b><br><span class="muted tiny">${esc(roles[x.role].label)} · ${new Date(x.end).toLocaleDateString('fa-IR')}</span></span><span class="pill">${x.percent}٪ ‹</span></button>`).join(''):'<p>هنوز هیچ آزمونی ثبت نشده است.</p>'}</div><div class="card"><h3>تنظیمات آزمون</h3><p>تعداد سؤالات در نسخه نمونه: ۱۰۰ سؤال چهارگزینه‌ای.</p><label class="label" for="duration">زمان آزمون‌های بعدی (دقیقه)</label><select id="duration" class="field"><option value="60" ${setting().minutes===60?'selected':''}>۶۰ دقیقه</option><option value="90" ${setting().minutes===90?'selected':''}>۹۰ دقیقه</option><option value="120" ${setting().minutes===120?'selected':''}>۱۲۰ دقیقه</option></select><button data-act="saveDuration" class="secondary full" style="margin-top:12px">ذخیره تنظیمات</button><button data-act="server" class="secondary full" style="margin-top:12px">اتصال به سرور اختصاصی شرکت</button></div><div class="notice danger">گزارش‌های آفلاین فقط در همین برنامه روی همین گوشی هستند؛ برای دیدن پاسخ‌ها روی گوشی مدیر یا سیستم شرکت، سرویس آنلاین اختصاصی و احراز هویت سرور لازم است.</div>`}
function detailPage(r){let rows=r.answers||[];let byTopic={};rows.forEach(x=>{let a=byTopic[x.topic]||(byTopic[x.topic]={yes:0,total:0});a.total++;if(x.selected===x.correct)a.yes++});return `<div class="row" style="margin-top:24px"><button class="secondary" data-act="backResults">← فهرست</button><button class="secondary" data-act="logout">قفل مدیریت</button></div><div class="eyebrow">پاسخنامه مخصوص کارفرما</div><h1 class="title">${esc(r.profile.name)}</h1><p class="sub">${esc(roles[r.role].label)} · ${new Date(r.end).toLocaleString('fa-IR')}</p><div class="card"><div class="row"><div><span class="tiny muted">نمره کل</span><div style="font-size:40px;font-weight:900;color:#127748">${r.percent}٪</div></div><span class="pill">${r.timedOut?'اتمام زمان':'ثبت‌شده'}</span></div><div class="grid3"><div class="metric"><b>${r.right}</b><small>صحیح</small></div><div class="metric"><b>${r.wrong}</b><small>غلط</small></div><div class="metric"><b>${N-r.answered}</b><small>بدون پاسخ</small></div></div><div class="divider"></div><div><b>مشخصات</b><p>شماره تماس: <b dir="ltr">${esc(r.profile.mobile)}</b> · مدرک: ${esc(r.profile.education)}</p><p>سابقه: ${esc(r.profile.experience)} · شهر: ${esc(r.profile.city||'ثبت نشده')}</p><p>زمان صرف‌شده: ${Math.ceil(r.durationSeconds/60)} دقیقه · کد: ${esc(r.id)}</p></div></div><div class="card"><h3>عملکرد حوزه‌ها</h3>${Object.entries(byTopic).sort((a,b)=>a[0].localeCompare(b[0])).map(([topic,x])=>`<div class="row tiny" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(topic)}</span><b>${x.yes} / ${x.total}</b></div>`).join('')}</div><h3>پاسخ‌های ثبت‌شده</h3>${rows.map((x,i)=>`<div class="answer ${x.selected===x.correct?'good':'bad'}"><div class="row"><b>سؤال ${i+1} · ${esc(x.topic)}</b><span class="ansstate">${x.selected===null?'بی‌پاسخ':x.selected===x.correct?'صحیح':'غلط'}</span></div><p>${esc(x.text)}</p><div>پاسخ داوطلب: <b>${x.selected===null?'بدون پاسخ':esc(x.options[x.selected])}</b></div><div>پاسخ صحیح: <b>${esc(x.options[x.correct])}</b></div>${x.explanation?`<div class="tiny muted">${esc(x.explanation)}</div>`:''}</div>`).join('')}<button data-act="print" class="primary full" style="margin:20px 0">چاپ یا ذخیره گزارش به PDF</button><p class="footer">نتایج نمونه برای کنترل فرایند هستند، نه تصمیم قطعی استخدام.</p>`}
function render(){if(state.exam && remaining()<=0){complete(true);return}$('#root').innerHTML=state.page==='roles'?rolesPage():state.page==='personal'?personalPage():state.page==='exam'?examPage():state.page==='finished'?finishedPage():adminPage();$('#adminBtn').classList.toggle('hide',state.page==='exam'||state.page==='finished');}
async function submitPin(form){let pin=form.querySelector('#pin').value,stored=getJSON(K_PIN,null),err=$('#adminError');if(!/^\d{6}$/.test(pin)){err.textContent='کد باید دقیقاً ۶ رقم باشد.';return}try{if(!stored){let confirmPin=form.querySelector('#confirmPin').value;if(pin!==confirmPin){err.textContent='تکرار کد یکسان نیست.';return}let salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');let hash=await derivePin(pin,salt);if(!setJSON(K_PIN,{salt,hash,attempts:0,lockUntil:0}))return;state.adminOK=true;go('admin');return}if(stored.lockUntil>Date.now()){err.textContent='تلاش‌های ناموفق زیاد بوده؛ بعداً دوباره امتحان کنید.';return}let hash=await derivePin(pin,stored.salt);if(hash!==stored.hash){stored.attempts=(stored.attempts||0)+1;if(stored.attempts>=5){stored.lockUntil=Date.now()+60000;stored.attempts=0}setJSON(K_PIN,stored);err.textContent='کد مدیریت اشتباه است.';return}stored.attempts=0;stored.lockUntil=0;setJSON(K_PIN,stored);state.adminOK=true;state.selectedId=null;go('admin')}catch(e){err.textContent='این مرورگر از رمزنگاری موردنیاز پشتیبانی نمی‌کند.'}}
document.addEventListener('submit',e=>{if(e.target.id==='personalForm'){e.preventDefault();startExam(e.target)}if(e.target.id==='pinForm'){e.preventDefault();submitPin(e.target)}});
document.addEventListener('click',e=>{const role=e.target.closest('[data-role]');if(role){if(state.exam){go('exam');return}state.role=+role.dataset.role;go('personal');return}const choice=e.target.closest('[data-choice]');if(choice&&state.page==='exam'){chooseAnswer(+choice.dataset.choice);return}const report=e.target.closest('[data-report]');if(report&&state.adminOK){state.selectedId=report.dataset.report;go('admin');return}const btn=e.target.closest('[data-act]');if(!btn)return;switch(btn.dataset.act){case 'roles':go('roles');break;case 'admin':if(state.exam){go('exam');break}state.selectedId=null;go('admin');break;case 'next':moveNext();break;case 'prev':state.idx=Math.max(0,state.idx-1);go('exam');break;case 'submit':if(confirm('آزمون زودتر تمام شود؟ پاسخ‌های ثبت‌شده نهایی خواهند شد.'))complete(false);break;case 'new':state.role=null;state.selectedId=null;go('roles');break;case 'logout':state.adminOK=false;state.selectedId=null;go('roles');break;case 'backResults':state.selectedId=null;go('admin');break;case 'saveDuration':if(state.adminOK){setJSON(K_CONFIG,{minutes:+$('#duration').value});go('admin')}break;case 'server':if(state.adminOK)location.href='asan://setup';break;case 'print':if(state.adminOK)location.href='asan://print';break;}});
function tick(){if(state.exam){if(remaining()<=0){complete(true);return}if(state.page==='exam'){let el=$('#clock');if(el){el.textContent='⏱ '+fmtSecs(remaining());el.classList.toggle('warn',remaining()<=300)}}}}
setInterval(tick,1000);document.addEventListener('visibilitychange',tick);
if(state.exam){if(state.exam.qids&&state.exam.qids.length){state.idx=Math.min(state.exam.qids.length-1,N-1);state.page='exam'}else{localStorage.removeItem(K_ACTIVE);state.exam=null}}
render();
</script></body></html>
